name: Aplicar padrão visual dos cabeçalhos
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar cabeçalhos
        shell: python
        run: |
          from pathlib import Path
          p=Path('streamlit_app.py')
          s=p.read_text(encoding='utf-8')
          old=''' .hero{{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}}.hero h1{{margin:0;font-family:{fontes["titulo"]},sans-serif;font-size:30px;color:{TEXT}}}.hero p,.muted{{font-family:{fontes["subtitulo"]},sans-serif;color:{MUTED}}}.period{{background:{PRIMARY};color:#111;padding:10px 15px;border-radius:9px;font-weight:900;text-transform:uppercase}}'''.strip()
          new='''.hero{{display:flex;justify-content:space-between;align-items:center;gap:24px;margin:10px 0 24px;padding:20px 22px;border:1px solid {BORDER};border-radius:16px;background:linear-gradient(145deg,{PANEL},#0d1210);box-sizing:border-box;min-height:112px}}.hero h1{{margin:0;font-family:{fontes["titulo"]},sans-serif;font-size:30px;line-height:1.1;font-weight:900;color:{TEXT};text-transform:uppercase;letter-spacing:.3px}}.hero p,.muted{{font-family:{fontes["subtitulo"]},sans-serif;color:{MUTED}}}.hero p{{margin:8px 0 0;font-size:14px;line-height:1.4}}.period{{background:{PRIMARY};color:#111;padding:12px 18px;border-radius:10px;font-weight:900;text-transform:uppercase;white-space:nowrap;font-size:14px}}'''
          if old not in s: raise SystemExit('hero CSS não encontrado')
          s=s.replace(old,new,1)
          s=s.replace('"titulo_indicadores":"Alimentar Indicadores"','"titulo_indicadores":"Indicadores Operacionais"')
          p.write_text(s,encoding='utf-8')

          p=Path('indicadores_dashboard.py')
          s=p.read_text(encoding='utf-8')
          old='''    head_left, head_right = st.columns([5.5, 1.5], gap="medium")
    with head_left:
        st.markdown('<div class="ind-page-title">INDICADORES OPERACIONAIS</div><div class="ind-page-sub">Acompanhamento dos principais indicadores do almoxarifado.</div>', unsafe_allow_html=True)
    with head_right:
        st.markdown('<div class="ind-export-label">DIVULGAÇÃO</div>', unsafe_allow_html=True)'''
          new='''    head_left, head_right = st.columns([5.5, 1.5], gap="medium")
    with head_left:
        st.markdown('<div class="ind-page-spacer"></div>', unsafe_allow_html=True)
    with head_right:
        st.markdown('<div class="ind-export-label">DIVULGAÇÃO</div>', unsafe_allow_html=True)'''
          if old not in s: raise SystemExit('header do indicadores não encontrado')
          s=s.replace(old,new,1)
          s=s.replace('.ind-page-title{font-size:22px;font-weight:900;color:#f4f5f4;text-transform:uppercase;letter-spacing:.4px;margin:2px 0 3px}.ind-page-sub{font-size:12px;color:#9aa39f;margin-bottom:12px}', '.ind-page-spacer{height:1px}.ind-page-title{font-size:22px;font-weight:900;color:#f4f5f4;text-transform:uppercase;letter-spacing:.4px;margin:2px 0 3px}.ind-page-sub{font-size:12px;color:#9aa39f;margin-bottom:12px}')
          p.write_text(s,encoding='utf-8')
      - name: Validar
        run: python -m py_compile streamlit_app.py indicadores_dashboard.py
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add streamlit_app.py indicadores_dashboard.py
          git commit -m 'feat: padronizar cabeçalhos das páginas' || exit 0
          git push
