name: Apply novo usuario
on:
  push:
    paths:
      - '.github/trigger-novo-usuario.txt'
      - 'patch_novo_usuario.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar cadastro de usuarios
        run: |
          python patch_novo_usuario.py
          python -m py_compile controle_acesso.py
      - name: Commitar alteracoes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add controle_acesso.py
          git diff --cached --quiet || git commit -m 'Adiciona criação de usuários no painel de acesso'
          git rm -f patch_novo_usuario.py .github/workflows/apply-novo-usuario.yml .github/trigger-novo-usuario.txt || true
          git commit -m 'Remove rotina temporária de criação de usuários' || true
          git push
