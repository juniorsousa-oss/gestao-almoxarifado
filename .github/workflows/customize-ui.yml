name: Personalizar textos e fontes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/customize-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar personalização
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('streamlit_app.py')
          s = p.read_text(encoding='utf-8')

          if 'TEXTOS_PADRAO = {' not in s:
              anchor = 'ESTILOS_BOTOES = ["Amarelo", "Colorido"]'
              add = '''

TEXTOS_PADRAO = {
    "menu_dashboard": "Dashboard",
    "menu_indicadores": "Alimentar Indicadores",
    "menu_historico": "Histórico",
    "menu_equipes": "Gestão de Equipes",
    "menu_carreira": "Plano de Carreira",
    "menu_configuracoes": "Configurações",
    "titulo_dashboard": "Dashboard",
    "titulo_indicadores": "Alimentar Indicadores",
    "titulo_historico": "Histórico",
    "titulo_equipes": "Gestão de Equipes",
    "titulo_carreira": "Plano de Carreira",
    "titulo_configuracoes": "Configurações",
    "subtitulo_global": "Gestão operacional do almoxarifado",
    "secao_dados_reais": "Dados reais do Supabase",
    "secao_indicadores": "Indicadores",
    "secao_historico": "Histórico real",
    "secao_colaboradores": "Colaboradores",
    "secao_equipes": "Equipes",
    "secao_organograma": "Organograma",
    "diagnostico": "Diagnóstico",
    "mensagem_sem_indicadores": "A tabela almox_indicadores está conectada, mas ainda não possui lançamentos.",
    "mensagem_indicadores": "Consulta do banco real habilitada. A gravação será liberada junto com autenticação adequada.",
    "mensagem_carreira": "Módulo preparado para receber níveis, competências, metas e trilhas de desenvolvimento.",
    "rodape_linha1": "Gestão Operacional",
    "rodape_linha2": "SETTA • Streamlit + Supabase",
    "rodape_linha3": "Gestão Almoxarifado • Streamlit + Supabase • migração em andamento",
}
FONTES_PADRAO = {"menu": "Arial", "titulo": "Arial", "subtitulo": "Arial"}
FONTES = ["Arial", "Verdana", "Trebuchet MS", "Georgia", "Courier New", "Times New Roman"]
'''
              s = s.replace(anchor, anchor + add)

          old = '''config = st.session_state.config
PRIMARY = CORES.get(config.get("cor_principal"), CORES["Amarelo (Padrão)"])'''
          new = '''config = st.session_state.config
config.setdefault("textos", TEXTOS_PADRAO.copy())
config.setdefault("fontes", FONTES_PADRAO.copy())
for k, v in TEXTOS_PADRAO.items(): config["textos"].setdefault(k, v)
for k, v in FONTES_PADRAO.items(): config["fontes"].setdefault(k, v)
textos = config["textos"]
fontes = config["fontes"]
def txt(k): return textos.get(k, TEXTOS_PADRAO.get(k, k))
PRIMARY = CORES.get(config.get("cor_principal"), CORES["Amarelo (Padrão)"])'''
          s = s.replace(old, new)

          s = s.replace('font-size:30px;color:{TEXT}', 'font-family:{fontes["titulo"]},sans-serif;font-size:30px;color:{TEXT}')
          s = s.replace('.hero p,.muted{{color:{MUTED}}}', '.hero p,.muted{{font-family:{fontes["subtitulo"]},sans-serif;color:{MUTED}}}')
          s = s.replace('font-size:14px;font-weight:900;text-align:center;padding:0 10px', 'font-family:{fontes["menu"]},sans-serif;font-size:14px;font-weight:900;text-align:center;padding:0 10px')

          old = '''if "pagina" not in st.session_state:
    st.session_state.pagina = "Dashboard"

paginas = ["Dashboard", "Alimentar Indicadores", "Histórico", "Gestão de Equipes", "Plano de Carreira", "Configurações"]'''
          new = '''if "pagina" not in st.session_state:
    st.session_state.pagina = "dashboard"

paginas_ids = ["dashboard", "indicadores", "historico", "equipes", "carreira", "configuracoes"]
paginas = [txt("menu_" + x) for x in paginas_ids]'''
          s = s.replace(old, new)

          old = '''    for p in paginas:
        ativo = st.session_state.pagina == p
        if st.button(p.upper(), use_container_width=True, type="primary" if ativo else "secondary", key=f"menu_{p}"):
            st.session_state.pagina = p
            st.rerun()'''
          new = '''    for pid, p in zip(paginas_ids, paginas):
        ativo = st.session_state.pagina == pid
        if st.button(p.upper(), use_container_width=True, type="primary" if ativo else "secondary", key=f"menu_{pid}"):
            st.session_state.pagina = pid
            st.rerun()'''
          s = s.replace(old, new)

          s = s.replace('pagina = st.session_state.pagina\nMESES_PT', 'pagina = st.session_state.pagina\nif pagina not in paginas_ids:\n    pagina = "dashboard"\n    st.session_state.pagina = pagina\nMESES_PT')
          s = s.replace('if pagina == "Dashboard":', 'if pagina == "dashboard":')
          s = s.replace('elif pagina == "Alimentar Indicadores":', 'elif pagina == "indicadores":')
          s = s.replace('elif pagina == "Histórico":', 'elif pagina == "historico":')
          s = s.replace('elif pagina == "Gestão de Equipes":', 'elif pagina == "equipes":')
          s = s.replace('elif pagina == "Plano de Carreira":', 'elif pagina == "carreira":')
          s = s.replace('elif pagina == "Configurações":', 'elif pagina == "configuracoes":')

          old = '''st.markdown(f'<div class="hero"><div><h1>{pagina}</h1><p>Gestão operacional do almoxarifado</p></div><div class="period">{competencia_atual}</div></div>', unsafe_allow_html=True)'''
          new = '''titulo_id = "titulo_" + pagina
st.markdown(f'<div class="hero"><div><h1>{txt(titulo_id)}</h1><p>{txt("subtitulo_global")}</p></div><div class="period">{competencia_atual}</div></div>', unsafe_allow_html=True)'''
          s = s.replace(old, new)

          replacements = {
              'st.markdown(\'<div class="section">Dados reais do Supabase</div>\', unsafe_allow_html=True)': 'st.markdown(f\'<div class="section">{txt("secao_dados_reais")}</div>\', unsafe_allow_html=True)',
              'st.markdown(\'<div class="section">Indicadores</div>\', unsafe_allow_html=True)': 'st.markdown(f\'<div class="section">{txt("secao_indicadores")}</div>\', unsafe_allow_html=True)',
              'st.markdown(\'<div class="section">Histórico real</div>\', unsafe_allow_html=True)': 'st.markdown(f\'<div class="section">{txt("secao_historico")}</div>\', unsafe_allow_html=True)',
              'st.markdown(\'<div class="section">Colaboradores</div>\', unsafe_allow_html=True)': 'st.markdown(f\'<div class="section">{txt("secao_colaboradores")}</div>\', unsafe_allow_html=True)',
              'st.markdown(\'<div class="section">Equipes</div>\', unsafe_allow_html=True)': 'st.markdown(f\'<div class="section">{txt("secao_equipes")}</div>\', unsafe_allow_html=True)',
              'st.markdown(\'<div class="section">Organograma</div>\', unsafe_allow_html=True)': 'st.markdown(f\'<div class="section">{txt("secao_organograma")}</div>\', unsafe_allow_html=True)',
              'st.expander("Diagnóstico")': 'st.expander(txt("diagnostico"))',
              'st.info("A tabela almox_indicadores está conectada, mas ainda não possui lançamentos.")': 'st.info(txt("mensagem_sem_indicadores"))',
              'st.markdown(\'<div class="notice">Consulta do banco real habilitada. A gravação será liberada junto com autenticação adequada.</div>\', unsafe_allow_html=True)': 'st.markdown(f\'<div class="notice">{txt("mensagem_indicadores")}</div>\', unsafe_allow_html=True)',
              'st.info("Módulo preparado para receber níveis, competências, metas e trilhas de desenvolvimento.")': 'st.info(txt("mensagem_carreira"))',
          }
          for a, b in replacements.items(): s = s.replace(a, b)

          s = s.replace('st.markdown("<div class=\'sidebar-footer\'>Gestão Operacional<br>SETTA • Streamlit + Supabase</div>", unsafe_allow_html=True)', 'st.markdown(f"<div class=\'sidebar-footer\'>{txt(\"rodape_linha1\")}<br>{txt(\"rodape_linha2\")}</div>", unsafe_allow_html=True)')
          s = s.replace('st.markdown("<br><div class=\'muted\'>Gestão Almoxarifado • Streamlit + Supabase • migração em andamento</div>", unsafe_allow_html=True)', 'st.markdown(f"<br><div class=\'muted\'>{txt(\"rodape_linha3\")}</div>", unsafe_allow_html=True)')

          marker = '    with col2:\n        arquivo = st.file_uploader("Logo da empresa", type=["png","jpg","jpeg","svg"], help="Até 2 MB")'
          block = '''    st.markdown("### Personalização de textos e fontes")
    t1, t2 = st.columns(2)
    with t1:
        st.caption("Menus")
        novo_textos = textos.copy()
        for chave, rotulo in [("menu_dashboard","Menu Dashboard"),("menu_indicadores","Menu Indicadores"),("menu_historico","Menu Histórico"),("menu_equipes","Menu Gestão de Equipes"),("menu_carreira","Menu Plano de Carreira"),("menu_configuracoes","Menu Configurações")]:
            novo_textos[chave] = st.text_input(rotulo, value=textos[chave], key="edit_"+chave)
        st.caption("Títulos")
        for chave, rotulo in [("titulo_dashboard","Título Dashboard"),("titulo_indicadores","Título Indicadores"),("titulo_historico","Título Histórico"),("titulo_equipes","Título Gestão de Equipes"),("titulo_carreira","Título Plano de Carreira"),("titulo_configuracoes","Título Configurações")]:
            novo_textos[chave] = st.text_input(rotulo, value=textos[chave], key="edit_"+chave)
    with t2:
        st.caption("Subtítulos e seções")
        novo_textos["subtitulo_global"] = st.text_input("Subtítulo principal", value=textos["subtitulo_global"])
        for chave, rotulo in [("secao_dados_reais","Seção dados reais"),("secao_indicadores","Seção indicadores"),("secao_historico","Seção histórico"),("secao_colaboradores","Seção colaboradores"),("secao_equipes","Seção equipes"),("secao_organograma","Seção organograma")]:
            novo_textos[chave] = st.text_input(rotulo, value=textos[chave])
        st.caption("Fontes")
        nova_fontes = fontes.copy()
        nova_fontes["menu"] = st.selectbox("Fonte dos menus", FONTES, index=FONTES.index(fontes.get("menu","Arial")))
        nova_fontes["titulo"] = st.selectbox("Fonte dos títulos", FONTES, index=FONTES.index(fontes.get("titulo","Arial")))
        nova_fontes["subtitulo"] = st.selectbox("Fonte dos subtítulos", FONTES, index=FONTES.index(fontes.get("subtitulo","Arial")))
    if st.button("SALVAR TEXTOS E FONTES", type="primary", use_container_width=True):
        novo = config.copy(); novo["textos"] = novo_textos; novo["fontes"] = nova_fontes
        if salvar_configuracoes(novo):
            st.session_state.config = novo
            st.success("Textos e fontes salvos.")
            st.rerun()

    with col2:
        arquivo = st.file_uploader("Logo da empresa", type=["png","jpg","jpeg","svg"], help="Até 2 MB")'''
          if marker in s:
              s = s.replace(marker, block)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Validar Python
        run: python -m py_compile streamlit_app.py
      - name: Commit da alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Adiciona edição de textos e fontes"
          git push
