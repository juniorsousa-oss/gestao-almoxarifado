name: Personalizar textos e fontes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/customize-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar personalização
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('streamlit_app.py')
          s = p.read_text(encoding='utf-8')

          anchor = 'ESTILOS_BOTOES = ["Amarelo", "Colorido"]'
          add = '''\n\nTEXTOS_PADRAO = {\n    "menu_dashboard": "Dashboard",\n    "menu_indicadores": "Alimentar Indicadores",\n    "menu_historico": "Histórico",\n    "menu_equipes": "Gestão de Equipes",\n    "menu_carreira": "Plano de Carreira",\n    "menu_configuracoes": "Configurações",\n    "titulo_dashboard": "Dashboard",\n    "titulo_indicadores": "Alimentar Indicadores",\n    "titulo_historico": "Histórico",\n    "titulo_equipes": "Gestão de Equipes",\n    "titulo_carreira": "Plano de Carreira",\n    "titulo_configuracoes": "Configurações",\n    "subtitulo_global": "Gestão operacional do almoxarifado",\n    "secao_dados_reais": "Dados reais do Supabase",\n    "secao_indicadores": "Indicadores",\n    "secao_historico": "Histórico real",\n    "secao_colaboradores": "Colaboradores",\n    "secao_equipes": "Equipes",\n    "secao_organograma": "Organograma",\n    "mensagem_sem_indicadores": "A tabela almox_indicadores está conectada, mas ainda não possui lançamentos.",\n    "diagnostico": "Diagnóstico",\n    "mensagem_indicadores": "Consulta do banco real habilitada. A gravação será liberada junto com autenticação adequada.",\n    "mensagem_carreira": "Módulo preparado para receber níveis, competências, metas e trilhas de desenvolvimento.",\n    "rodape_linha1": "Gestão Operacional",\n    "rodape_linha2": "SETTA • Streamlit + Supabase",\n    "rodape_linha3": "Gestão Almoxarifado • Streamlit + Supabase • migração em andamento",\n}\nFONTES_PADRAO = {\n    "menu": "Arial",\n    "titulo": "Arial",\n    "subtitulo": "Arial",\n}\nFONTES = ["Arial", "Verdana", "Trebuchet MS", "Georgia", "Courier New", "Times New Roman"]\n'''
          if 'TEXTOS_PADRAO = {' not in s:
              s = s.replace(anchor, anchor + add)

          old = '''config = st.session_state.config\nPRIMARY = CORES.get(config.get("cor_principal"), CORES["Amarelo (Padrão)"])'''
          new = '''config = st.session_state.config\nconfig.setdefault("textos", TEXTOS_PADRAO.copy())\nconfig.setdefault("fontes", FONTES_PADRAO.copy())\nfor _k, _v in TEXTOS_PADRAO.items():\n    config["textos"].setdefault(_k, _v)\nfor _k, _v in FONTES_PADRAO.items():\n    config["fontes"].setdefault(_k, _v)\ntextos = config["textos"]\nfontes = config["fontes"]\ndef txt(k): return textos.get(k, TEXTOS_PADRAO.get(k, k))\nPRIMARY = CORES.get(config.get("cor_principal"), CORES["Amarelo (Padrão)"])'''
          if old in s and 'def txt(k)' not in s:
              s = s.replace(old, new)

          s = s.replace('font-size:30px;color:{TEXT}', 'font-family:{fontes["titulo"]},sans-serif;font-size:30px;color:{TEXT}')
          s = s.replace('.hero p,.muted{{color:{MUTED}}}', '.hero p,.muted{{font-family:{fontes["subtitulo"]},sans-serif;color:{MUTED}}}')
          s = s.replace('font-size:14px;font-weight:900;text-align:center;padding:0 10px', 'font-family:{fontes["menu"]},sans-serif;font-size:14px;font-weight:900;text-align:center;padding:0 10px')
          s = s.replace('font-size:14px;font-weight:900;letter-spacing:.15px;color:inherit', 'font-family:{fontes["menu"]},sans-serif;font-size:14px;font-weight:900;letter-spacing:.15px;color:inherit')

          old_sidebar = '''paginas = ["Dashboard", "Alimentar Indicadores", "Histórico", "Gestão de Equipes", "Plano de Carreira", "Configurações"]\n\nwith st.sidebar:'''
          new_sidebar = '''paginas_ids = ["dashboard", "indicadores", "historico", "equipes", "carreira", "configuracoes"]\npaginas = [txt("menu_" + x) for x in paginas_ids]\n\nwith st.sidebar:'''
          if old_sidebar in s:
              s = s.replace(old_sidebar, new_sidebar)

          old_loop = '''    for p in paginas:\n        ativo = st.session_state.pagina == p\n        if st.button(p.upper(), use_container_width=True, type="primary" if ativo else "secondary", key=f"menu_{p}"):\n            st.session_state.pagina = p\n            st.rerun()'''
          new_loop = '''    for pid, p in zip(paginas_ids, paginas):\n        ativo = st.session_state.pagina == pid\n        if st.button(p.upper(), use_container_width=True, type="primary" if ativo else "secondary", key=f"menu_{pid}"):\n            st.session_state.pagina = pid\n            st.rerun()'''
          if old_loop in s:
              s = s.replace(old_loop, new_loop)

          s = s.replace('st.session_state.pagina = "Dashboard"', 'st.session_state.pagina = "dashboard"')
          s = s.replace('pagina = st.session_state.pagina\nMESES_PT', 'pagina = st.session_state.pagina\nif pagina not in paginas_ids:\n    pagina = "dashboard"\n    st.session_state.pagina = pagina\nMESES_PT')

          old_hero = '''st.markdown(f'<div class="hero"><div><h1>{pagina}</h1><p>Gestão operacional do almoxarifado</p></div><div class="period">{competencia_atual}</div></div>', unsafe_allow_html=True)'''
          new_hero = '''titulo_id = "titulo_" + pagina\nst.markdown(f'<div class="hero"><div><h1>{txt(titulo_id)}</h1><p>{txt("subtitulo_global")}</p></div><div class="period">{competencia_atual}</div></div>', unsafe_allow_html=True)'''
          if old_hero in s:
              s = s.replace(old_hero, new_hero)

          for a,b in [
            ('if pagina == "Dashboard":','if pagina == "dashboard":'),
            ('elif pagina == "Alimentar Indicadores":','elif pagina == "indicadores":'),
            ('elif pagina == "Histórico":','elif pagina == "historico":'),
            ('elif pagina == "Gestão de Equipes":','elif pagina == "equipes":'),
            ('elif pagina == "Plano de Carreira":','elif pagina == "carreira":'),
            ('elif pagina == "Configurações":','elif pagina == "configuracoes":'),
          ]:
              s = s.replace(a,b)

          replacements = {
            'st.markdown(\'<div class="section">Dados reais do Supabase</div>\'', 'st.markdown(f\'<div class="section">{txt("secao_dados_reais")}</div>\'',
            'st.markdown(\'<div class="section">Indicadores</div>\'', 'st.markdown(f\'<div class="section">{txt("secao_indicadores")}</div>\'',
            'st.markdown(\'<div class="section">Histórico real</div>\'', 'st.markdown(f\'<div class="section">{txt("secao_historico")}</div>\'',
            'st.markdown(\'<div class="section">Colaboradores</div>\'', 'st.markdown(f\'<div class="section">{txt("secao_colaboradores")}</div>\'',
            'st.markdown(\'<div class="section">Equipes</div>\'', 'st.markdown(f\'<div class="section">{txt("secao_equipes")}</div>\'',
            'st.markdown(\'<div class="section">Organograma</div>\'', 'st.markdown(f\'<div class="section">{txt("secao_organograma")}</div>\'',
            'st.expander("Diagnóstico")', 'st.expander(txt("diagnostico"))',
            'st.info("A tabela almox_indicadores está conectada, mas ainda não possui lançamentos.")', 'st.info(txt("mensagem_sem_indicadores"))',
            'st.markdown(\'<div class="notice">Consulta do banco real habilitada. A gravação será liberada junto com autenticação adequada.</div>\'', 'st.markdown(f\'<div class="notice">{txt("mensagem_indicadores")}</div>\'',
            'st.markdown(\'<div class="section">Plano de carreira</div>\'', 'st.markdown(f\'<div class="section">{txt("titulo_carreira")}</div>\'',
            'st.info("Módulo preparado para receber níveis, competências, metas e trilhas de desenvolvimento.")', 'st.info(txt("mensagem_carreira"))',
          }
          for a,b in replacements.items(): s = s.replace(a,b)

          s = s.replace('st.markdown("<div class=\'sidebar-footer\'>Gestão Operacional<br>SETTA • Streamlit + Supabase</div>", unsafe_allow_html=True)', 'st.markdown(f"<div class=\'sidebar-footer\'>{txt(\"rodape_linha1\")}<br>{txt(\"rodape_linha2\")}</div>", unsafe_allow_html=True)')
          s = s.replace('st.markdown("<br><div class=\'muted\'>Gestão Almoxarifado • Streamlit + Supabase • migração em andamento</div>", unsafe_allow_html=True)', 'st.markdown(f"<br><div class=\'muted\'>{txt(\"rodape_linha3\")}</div>", unsafe_allow_html=True)')

          # Configurações: adiciona painel completo de textos e fontes antes do upload da logo.
          marker = '    with col2:\n        arquivo = st.file_uploader("Logo da empresa"'
          block = '''    st.markdown("### Personalização de textos e fontes")\n    tcol1, tcol2 = st.columns(2)\n    with tcol1:\n        st.caption("Menus")\n        novo_textos = textos.copy()\n        for chave, rotulo in [("menu_dashboard","Menu Dashboard"),("menu_indicadores","Menu Indicadores"),("menu_historico","Menu Histórico"),("menu_equipes","Menu Gestão de Equipes"),("menu_carreira","Menu Plano de Carreira"),("menu_configuracoes","Menu Configurações")]:\n            novo_textos[chave] = st.text_input(rotulo, value=textos[chave], key="txt_" + chave)\n        st.caption("Títulos")\n        for chave, rotulo in [("titulo_dashboard","Título Dashboard"),("titulo_indicadores","Título Indicadores"),("titulo_historico","Título Histórico"),("titulo_equipes","Título Gestão de Equipes"),("titulo_carreira","Título Plano de Carreira"),("titulo_configuracoes","Título Configurações")]:\n            novo_textos[chave] = st.text_input(rotulo, value=textos[chave], key="txt_" + chave)\n    with tcol2:\n        st.caption("Subtítulo e seções")\n        novo_textos["subtitulo_global"] = st.text_input("Subtítulo principal", value=textos["subtitulo_global"])\n        novo_textos["secao_dados_reais"] = st.text_input("Seção: dados reais", value=textos["secao_dados_reais"])\n        novo_textos["secao_indicadores"] = st.text_input("Seção: indicadores", value=textos["secao_indicadores"])\n        novo_textos["secao_historico"] = st.text_input("Seção: histórico", value=textos["secao_historico"])\n        novo_textos["secao_colaboradores"] = st.text_input("Seção: colaboradores", value=textos["secao_colaboradores"])\n        novo_textos["secao_equipes"] = st.text_input("Seção: equipes", value=textos["secao_equipes"])\n        novo_textos["secao_organograma"] = st.text_input("Seção: organograma", value=textos["secao_organograma"])\n        st.caption("Fontes")\n        nova_fontes = fontes.copy()\n        nova_fontes["menu"] = st.selectbox("Fonte dos menus", FONTES, index=FONTES.index(fontes.get("menu","Arial")))\n        nova_fontes["titulo"] = st.selectbox("Fonte dos títulos", FONTES, index=FONTES.index(fontes.get("titulo","Arial")))\n        nova_fontes["subtitulo"] = st.selectbox("Fonte dos subtítulos", FONTES, index=FONTES.index(fontes.get("subtitulo","Arial")))\n\n    if st.button("SALVAR TEXTOS E FONTES", type="primary", use_container_width=True):\n        novo = config.copy()\n        novo["textos"] = novo_textos\n        novo["fontes"] = nova_fontes\n        try:\n            if salvar_configuracoes(novo):\n                st.session_state.config = novo\n                st.success("Textos e fontes salvos.")\n                st.rerun()\n            else:\n                st.error("Não foi possível salvar textos e fontes.")\n        except Exception as e:\n            st.error(f"Erro ao salvar textos e fontes: {e}")\n\n    with col2:\n        arquivo = st.file_uploader("Logo da empresa"'''
          if marker in s and 'SALVAR TEXTOS E FONTES' not in s:
              s = s.replace(marker, block)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Validar Python
        run: python -m py_compile streamlit_app.py
      - name: Commit da alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Adiciona edição de textos e fontes"
          git push
