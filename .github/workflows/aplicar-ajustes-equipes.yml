name: aplicar-ajustes-equipes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Executar patch
        run: python tools/patch_equipes_layout.py
      - name: Corrigir label gerado
        run: python tools/fix_generated_label.py
      - name: Validar Python
        run: python -m py_compile streamlit_app.py
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git add streamlit_app.py
          git diff --cached --quiet || git commit -m 'fix: corrigir layout de equipes organograma e colaboradores'
          git rebase origin/main || true
          git push origin HEAD:main
      - name: Remover patch temporario
        run: |
          git fetch origin main
          git reset --hard origin/main
          git rm .github/workflows/aplicar-ajustes-equipes.yml tools/patch_equipes_layout.py tools/fix_generated_label.py tools/.equipes_patch_trigger
          git commit -m 'chore: remover patch temporario da aba equipes'
          git push origin HEAD:main
