name: Optimize App Performance
on:
  push:
    paths:
      - '.github/workflows/optimize-app-performance.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply performance optimizations
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          # 1) Reuse one Supabase client per Streamlit process.
          replace_once(
              'supabase_client.py',
              'def get_client() -> Client:\n',
              '@st.cache_resource(show_spinner=False)\ndef get_client() -> Client:\n',
          )

          # 2) Cache logo background detection and database reads longer.
          replace_once(
              'streamlit_app.py',
              'def detectar_cor_fundo_logo(logo_b64,logo_mime=None):\n',
              '@st.cache_data(show_spinner=False)\ndef detectar_cor_fundo_logo(logo_b64,logo_mime=None):\n',
          )
          replace_once(
              'streamlit_app.py',
              '@st.cache_data(ttl=30)\ndef rows(table,limit=500,order=None):\n    q=get_client().table(table).select("*")\n    if order:q=q.order(order,desc=True)\n    return q.limit(limit).execute().data or []\n',
              '@st.cache_data(ttl=120,show_spinner=False)\ndef rows(table,limit=500,order=None,desc=True,columns="*"):\n    q=get_client().table(table).select(columns)\n    if order:q=q.order(order,desc=desc)\n    return q.limit(limit).execute().data or []\n',
          )

          # 3) Any real data mutation that is logged invalidates cached reads.
          replace_once(
              'streamlit_app.py',
              'def registrar_historico(tipo,descricao,dados):\n    try:get_client().table("almox_historico").insert({"tipo":tipo,"descricao":descricao,"dados":dados}).execute()\n    except Exception:pass\n',
              'def registrar_historico(tipo,descricao,dados):\n    try:get_client().table("almox_historico").insert({"tipo":tipo,"descricao":descricao,"dados":dados}).execute()\n    except Exception:pass\n    finally:rows.clear()\n',
          )
          replace_once(
              'streamlit_app.py',
              'def vincular_colaborador_a_equipe(cid,eid,nome=None):\n    dados={"equipe_id":eid,"equipe_atual":nome}\n    return get_client().table("almox_colaboradores").update(dados).eq("id",cid).execute()\n',
              'def vincular_colaborador_a_equipe(cid,eid,nome=None):\n    dados={"equipe_id":eid,"equipe_atual":nome}\n    resultado=get_client().table("almox_colaboradores").update(dados).eq("id",cid).execute()\n    rows.clear()\n    return resultado\n',
          )

          # 4) Dashboard no longer downloads large JSON snapshot payloads just to count rows.
          replace_once(
              'streamlit_app.py',
              '    indicadores=rows("almox_indicadores",order="competencia");colaboradores=rows("almox_colaboradores");equipes=rows("almox_equipes");historico=rows("almox_historico",order="criado_em");snapshots=rows("mrp_snapshots",order="created_at")\n',
              '    indicadores=rows("almox_indicadores",order="competencia");colaboradores=rows("almox_colaboradores",columns="id");equipes=rows("almox_equipes",columns="id");historico=rows("almox_historico",order="criado_em",columns="id");snapshots=rows("mrp_snapshots",order="created_at",columns="id,created_at")\n',
          )

          # 5) Gestão de Equipes now uses the shared cached read layer.
          replace_once(
              'streamlit_app.py',
              '    client=get_client();equipes_raw=client.table("almox_equipes").select("*").order("nome").execute().data or [];colaboradores_raw=client.table("almox_colaboradores").select("*").order("nome").execute().data or []\n',
              '    client=get_client();equipes_raw=rows("almox_equipes",order="nome",desc=False);colaboradores_raw=rows("almox_colaboradores",order="nome",desc=False)\n',
          )

          # 6) Cache expensive PDF export generation.
          replace_once(
              'indicadores_dashboard.py',
              'import html\nimport pandas as pd\n',
              'import html\nimport json\nimport pandas as pd\n',
          )
          replace_once(
              'indicadores_dashboard.py',
              'def _pct(v):\n',
              '@st.cache_data(ttl=300,show_spinner=False,max_entries=10)\ndef _pdf_indicadores_cache(payload):\n    return gerar_pdf_indicadores(json.loads(payload))\n\n\ndef _pct(v):\n',
          )
          replace_once(
              'indicadores_dashboard.py',
              '            pdf_bytes = gerar_pdf_indicadores(indicadores or [])\n',
              '            payload_pdf = json.dumps(indicadores or [],ensure_ascii=False,sort_keys=True,default=str)\n            pdf_bytes = _pdf_indicadores_cache(payload_pdf)\n',
          )

          # 7) Cache Excel audit bytes and isolate indicator uploader interactions to a fragment.
          replace_once(
              'indicadores_entregas_v2.py',
              'def _excel_auditoria(resultado, meta):\n',
              '@st.cache_data(show_spinner=False,max_entries=6)\ndef _excel_auditoria(resultado, meta):\n',
          )
          replace_once(
              'indicadores_entregas_v2.py',
              'def render_alimentacao_entregas_v2(indicadores):\n',
              '@st.fragment\ndef render_alimentacao_entregas_v2(indicadores):\n',
          )
          replace_once(
              'indicadores_entregas_v2.py',
              '                    st.session_state["entregas_v2_registrado"] = True\n                    st.success(f"Resultado {acao} com a data de hoje: {resultado[\'resultado_final\']:.2f}%.")\n',
              '                    st.session_state["entregas_v2_registrado"] = True\n                    st.cache_data.clear()\n                    st.success(f"Resultado {acao} com a data de hoje: {resultado[\'resultado_final\']:.2f}%.")\n',
          )
          PY

          python -m py_compile streamlit_app.py supabase_client.py indicadores_dashboard.py indicadores_entregas_v2.py

      - name: Commit optimized files and remove workflow
        run: |
          rm -f .github/workflows/optimize-app-performance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Otimiza consultas, cache e exportações do app" || exit 0
          git push origin main
