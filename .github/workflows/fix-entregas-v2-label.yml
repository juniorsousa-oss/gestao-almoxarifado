name: Fix Entregas V2 Label
on:
  push:
    paths:
      - '.github/workflows/fix-entregas-v2-label.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('indicadores_entregas_v2.py')
          s=p.read_text(encoding='utf-8').replace('DATA DE SEPARAÇÃO <== DATA CM','DATA DE SEPARAÇÃO <= DATA CM')
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile indicadores_entregas_v2.py indicadores_dashboard.py
          rm -f .github/workflows/fix-entregas-v2-label.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrige rótulo de critério de entrega" || exit 0
          git push origin main
