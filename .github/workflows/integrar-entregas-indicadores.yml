name: Integrar entregas nos indicadores

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrar-entregas-indicadores.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrar modulo de entregas
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('indicadores_dashboard.py')
          text = p.read_text(encoding='utf-8')

          imp = 'from indicadores_entregas import render_alimentacao_entregas\n'
          anchor = 'from indicadores_pdf import gerar_pdf_indicadores\n'
          if imp not in text:
              if anchor not in text:
                  raise SystemExit('Anchor de importacao nao encontrado')
              text = text.replace(anchor, anchor + imp, 1)

          fn = 'def render_indicadores(indicadores):\n'
          call = '    render_alimentacao_entregas(indicadores)\n\n'
          if call not in text:
              if fn not in text:
                  raise SystemExit('Funcao render_indicadores nao encontrada')
              text = text.replace(fn, fn + call, 1)

          p.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/integrar-entregas-indicadores.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicadores_dashboard.py .github/workflows/integrar-entregas-indicadores.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Integra alimentacao de Entregas no Prazo"
          git push
