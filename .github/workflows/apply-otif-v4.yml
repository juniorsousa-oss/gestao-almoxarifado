name: Aplicar OTIF Almox v4
on:
  push:
    paths:
      - '.github/workflows/apply-otif-v4.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Atualizar módulo OTIF
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          payload = ''''''
          with open('indicadores_entregas_v2.py','wb') as f:
              f.write(gzip.decompress(base64.b64decode(payload)))
          PY
          python -m py_compile indicadores_entregas_v2.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add indicadores_entregas_v2.py
          git commit -m 'Reformula OTIF Almox com funil de elegibilidade'
          git push origin main
