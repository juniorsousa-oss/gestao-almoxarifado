name: Apply UI final fix
on:
  push:
    paths:
      - '.github/trigger-ui-final-fix.txt'
      - 'ui-final-fix.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject UI fix script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          tag='<script src="ui-final-fix.js"></script>'
          if tag not in text:
              marker='</body>'
              if marker in text:
                  text=text.replace(marker, tag+'\n'+marker, 1)
              else:
                  text += '\n'+tag+'\n'
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: aplicar ajustes finais de interface'
          git push
