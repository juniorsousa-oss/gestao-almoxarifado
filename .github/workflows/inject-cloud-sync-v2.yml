name: Ativar Cloud Sync V2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inserir script de sincronização
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="./cloud-sync-v2.js"></script>'
          if tag not in text:
              marker = '<script src="./supabase-sync.js"></script>'
              if marker not in text:
                  raise SystemExit('Marcador supabase-sync.js não encontrado')
              text = text.replace(marker, marker + '\n' + tag, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Ajustar botão do menu lateral
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('streamlit_app.py')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'button[data-testid="stSidebarCollapseButton"]{{display:flex !important;visibility:visible !important;pointer-events:auto !important;position:fixed !important;top:64px !important;': 'button[data-testid="stSidebarCollapseButton"]{{display:flex !important;visibility:visible !important;opacity:1 !important;pointer-events:auto !important;position:fixed !important;top:10px !important;',
              'div[data-testid="collapsedControl"]{{position:fixed !important;top:64px !important;': 'div[data-testid="collapsedControl"]{{display:flex !important;visibility:visible !important;opacity:1 !important;pointer-events:auto !important;position:fixed !important;top:10px !important;',
              'div[data-testid="collapsedControl"] button{{display:flex !important;visibility:visible !important;pointer-events:auto !important;position:static !important;': 'div[data-testid="collapsedControl"] button{{display:flex !important;visibility:visible !important;opacity:1 !important;pointer-events:auto !important;position:static !important;',
          }
          changed = False
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
          if not changed:
              raise SystemExit('Nenhum seletor do botão lateral encontrado para ajuste.')
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile streamlit_app.py

      - name: Commit e push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add streamlit_app.py index.html
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'fix: manter botão do menu lateral visível [skip ci]'
          git push
