name: Ativar Cloud Sync V2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inserir script de sincronização
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="./cloud-sync-v2.js"></script>'
          if tag not in text:
              marker = '<script src="./supabase-sync.js"></script>'
              if marker in text:
                  p.write_text(text.replace(marker, marker + '\n' + tag, 1), encoding='utf-8')
          PY

      - name: Corrigir painel de admissões recentes
        run: python scripts/fix_admissions.py

      - name: Validar Python
        run: python -m py_compile streamlit_app.py

      - name: Commit e push
        shell: bash
        run: |
          rm -f .github/workflows/ajuste-admissoes.yml .github/trigger-ajuste.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html streamlit_app.py scripts/fix_admissions.py .github/workflows/ajuste-admissoes.yml .github/trigger-ajuste.txt
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'Corrige painel de admissões recentes [skip ci]'
          git push
