name: Ativar Cloud Sync V2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inserir script de sincronização
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="./cloud-sync-v2.js"></script>'
          if tag not in text:
              marker = '<script src="./supabase-sync.js"></script>'
              if marker not in text:
                  raise SystemExit('Marcador supabase-sync.js não encontrado')
              text = text.replace(marker, marker + '\n' + tag, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Remover menu superior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('streamlit_app.py')
          s = p.read_text(encoding='utf-8')
          old = '[data-testid="stToolbar"]{{display:flex !important;align-items:center !important;justify-content:flex-end !important;height:30px !important;min-height:30px !important;padding:0 8px !important;gap:2px !important;transform:none !important;}}'
          new = '[data-testid="stToolbar"]{{display:none !important;height:0 !important;min-height:0 !important;}}'
          if old in s:
              s = s.replace(old, new, 1)
          old = 'header[data-testid="stHeader"]{{display:block !important;background:#ffffff !important;height:30px !important;min-height:30px !important;border:0 !important;box-shadow:none !important;}}'
          new = 'header[data-testid="stHeader"]{{display:none !important;height:0 !important;min-height:0 !important;border:0 !important;box-shadow:none !important;}}'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile streamlit_app.py

      - name: Commit e push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html streamlit_app.py
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'Remove menu superior [skip ci]'
          git push
