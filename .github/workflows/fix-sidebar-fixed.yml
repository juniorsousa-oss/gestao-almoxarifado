name: Fix Sidebar Fixed
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Ajustar CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('streamlit_app.py')
          s=p.read_text(encoding='utf-8')
          old1='button[data-testid="stSidebarCollapseButton"]{{display:flex !important;visibility:visible !important;pointer-events:auto !important;position:fixed !important;top:10px !important;left:8px !important;right:auto !important;z-index:2147483647 !important;width:40px !important;height:34px !important;min-width:40px !important;min-height:34px !important;padding:0 !important;margin:0 !important;border-radius:8px !important;border:1px solid {BORDER} !important;background:#ffffff !important;color:#1f2937 !important;box-shadow:0 1px 4px rgba(0,0,0,.18) !important;}}'
          old2='div[data-testid="collapsedControl"]{{display:flex !important;visibility:visible !important;opacity:1 !important;pointer-events:auto !important;position:fixed !important;top:10px !important;left:8px !important;right:auto !important;bottom:auto !important;inset-inline-start:8px !important;inset-inline-end:auto !important;z-index:2147483647 !important;width:40px !important;height:34px !important;margin:0 !important;padding:0 !important;transform:none !important;}}'
          old3='div[data-testid="collapsedControl"] button{{display:flex !important;visibility:visible !important;opacity:1 !important;pointer-events:auto !important;position:static !important;width:40px !important;height:34px !important;min-width:40px !important;min-height:34px !important;padding:0 !important;margin:0 !important;border-radius:8px !important;border:1px solid {BORDER} !important;background:#ffffff !important;color:#1f2937 !important;box-shadow:0 1px 4px rgba(0,0,0,.18) !important;}}'
          old4='section[data-testid="stSidebar"][aria-expanded="false"]{{width:0 !important;min-width:0 !important;max-width:0 !important;}}'
          old5='section[data-testid="stSidebar"][aria-expanded="false"] > div:first-child{{width:0 !important;min-width:0 !important;padding:0 !important;}}'
          s=s.replace(old1,'button[data-testid="stSidebarCollapseButton"]{{display:none !important;}}')
          s=s.replace(old2,'div[data-testid="collapsedControl"]{{display:none !important;visibility:hidden !important;pointer-events:none !important;}}')
          s=s.replace(old3,'div[data-testid="collapsedControl"] button{{display:none !important;}}')
          s=s.replace(old4,'section[data-testid="stSidebar"][aria-expanded="false"]{{width:230px !important;min-width:230px !important;max-width:230px !important;}}')
          s=s.replace(old5,'section[data-testid="stSidebar"][aria-expanded="false"] > div:first-child{{width:230px !important;min-width:230px !important;padding:1px 9px 20px !important;}}')
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile streamlit_app.py
      - name: Commit ajuste
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add streamlit_app.py
          git commit -m 'fix: menu lateral fixo sem recolhimento [skip ci]' || true
          git push || true
      - name: Remover workflow temporário
        if: always()
        run: |
          git rm -f .github/workflows/fix-sidebar-fixed.yml || true
          git commit -m 'chore: remover workflow temporário [skip ci]' || true
          git push || true
