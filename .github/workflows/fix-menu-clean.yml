name: Clean main menu
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix-menu:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'fix: rebuild clean main menu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild menu CSS
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('plano-carreira-v2.js')
          s = p.read_text(encoding='utf-8')
          start = s.find('var CSS=`')
          if start < 0:
              raise SystemExit('CSS do modulo nao encontrado')
          css_start = start + len('var CSS=`')
          main_pos = s.find('.main{', css_start)
          if main_pos < 0:
              raise SystemExit('inicio do .main nao encontrado')
          clean = r'''\n/* O menu principal e controlado por uma unica regra visual. */
.sidebar{width:245px!important;padding:25px 17px!important;background:#0a0d0c!important;border-right:1px solid #252c29!important}
.sidebar .brand{height:72px!important;margin:0 0 20px!important;display:flex!important;align-items:center!important;justify-content:center!important}
.sidebar .brand img{max-width:165px!important;max-height:58px!important;object-fit:contain!important;display:block!important}
.sidebar .placeholder{font-size:33px!important;font-weight:800!important;letter-spacing:-2px!important}
.sidebar .nav{display:flex!important;flex-direction:column!important;gap:7px!important;padding:0!important}
.sidebar .nav button{box-sizing:border-box!important;position:relative!important;width:100%!important;height:46px!important;min-height:46px!important;margin:0!important;padding:0 15px!important;border:0!important;border-radius:10px!important;background:transparent!important;color:#b9c0bd!important;text-align:left!important;font-size:13px!important;font-weight:800!important;line-height:1!important;display:flex!important;align-items:center!important;gap:11px!important;overflow:hidden!important;white-space:nowrap!important;box-shadow:none!important}
.sidebar .nav button:hover{background:#181e1b!important;color:#fff!important}
.sidebar .nav button.active{background:var(--yellow)!important;color:#111!important}
.sidebar .nav button:focus,.sidebar .nav button:focus-visible{outline:none!important;box-shadow:none!important}
.sidebar .nav button>span{display:none!important}
.sidebar .nav button::before{display:inline-flex!important;flex:0 0 22px!important;width:22px!important;height:22px!important;align-items:center!important;justify-content:center!important;font-family:"Segoe UI Symbol","Segoe UI",Arial,sans-serif!important;font-size:17px!important;font-weight:400!important;line-height:1!important;color:currentColor!important}
#navDashboard::before{content:'▦'}
#navFeed::before{content:'✎'}
#navHistory::before{content:'◷'}
#navTeams::before{content:'♧'}
#navConfig::before{content:'⚙'}
#navCarreira::before{content:'⇧'}
#navCarreira{font-size:13px!important;font-weight:800!important}
'''
          s = s[:css_start] + clean + s[main_pos:]
          p.write_text(s, encoding='utf-8')
          print('menu CSS rebuilt')
      - name: Validate JavaScript
        run: node --check plano-carreira-v2.js
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plano-carreira-v2.js
          if git diff --cached --quiet; then
            echo 'Nenhuma alteracao necessaria'
          else
            git commit -m 'fix: rebuild clean main menu'
            git push
          fi
