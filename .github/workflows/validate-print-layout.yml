name: Validar layout exportacao

on:
  push:
    branches: [main]
    paths:
      - 'indicadores_pdf.py'
      - '.github/workflows/validate-print-layout.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe
        run: |
          python -m py_compile indicadores_pdf.py
      - name: Validar estrutura
        run: |
          python - <<'PY'
          from pathlib import Path
          txt = Path('indicadores_pdf.py').read_text(encoding='utf-8')
          checks = [
              'EXPORT_LAYOUT_VERSION = "print-approved-v3-logo"',
              'logo_base64',
              'Evolução mensal do indicador',
              'RESULTADO FINAL',
              'ACIMA DA META',
          ]
          missing = [x for x in checks if x not in txt]
          if missing:
              raise SystemExit(f'Itens ausentes: {missing}')
          print('layout exportacao: OK')
          PY
      - name: Remover workflow temporario
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-print-layout.yml
          git commit -m "Remove validacao temporaria do layout de exportacao" || exit 0
          git push
