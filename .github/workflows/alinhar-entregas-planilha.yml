name: Alinhar Entregas Planilha
on:
  push:
    paths:
      - ".github/workflows/alinhar-entregas-planilha.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar parametrizacao
        run: python .github/scripts/alinhar_entregas.py
      - name: Validar Python
        run: python -m py_compile indicadores_entregas_v2.py
      - name: Commitar alteracoes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicadores_entregas_v2.py
          git commit -m "Alinha Entregas no Prazo a planilha de conferencia"
          rm .github/workflows/alinhar-entregas-planilha.yml
          rm .github/scripts/alinhar_entregas.py
          git add -A
          git commit -m "Remove arquivos temporarios de parametrizacao"
          git push origin main
