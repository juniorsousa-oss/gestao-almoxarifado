name: Aplica regra de fechamento mensal dos indicadores

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/aplica-regra-fechamento-indicadores.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar patch
        run: python .github/scripts/aplica_regra_fechamento_indicadores.py

      - name: Validar Python
        run: python -m py_compile indicadores_regras.py indicadores_dashboard.py indicadores_pdf.py

      - name: Commit das alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicadores_regras.py indicadores_dashboard.py indicadores_pdf.py
          git commit -m "Usa último lançamento como fechamento mensal"
          git push

      - name: Limpar arquivos temporários
        run: |
          git rm .github/workflows/aplica-regra-fechamento-indicadores.yml
          git rm .github/scripts/aplica_regra_fechamento_indicadores.py
          git commit -m "Remove patch temporário de indicadores"
          git push
