name: Padroniza acoes dos indicadores
on:
  push:
    paths:
      - '.github/workflows/padroniza-acoes-indicadores.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Padronizar layout de acoes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('indicadores_dashboard.py')
          s = p.read_text(encoding='utf-8')

          old = '''        # Ações específicas ficam dentro do próprio indicador.\n        if name == "ENTREGAS NO PRAZO":\n            st.markdown('<div class="ind-actions-title">AÇÕES DO INDICADOR</div>', unsafe_allow_html=True)\n            render_alimentacao_entregas_v2(rows)\n            render_historico_otif()\n'''
          new = '''        # Área de ações padronizada para todos os indicadores.\n        st.markdown('<div class="ind-actions-title">AÇÕES DO INDICADOR</div>', unsafe_allow_html=True)\n        if name == "ENTREGAS NO PRAZO":\n            render_alimentacao_entregas_v2(rows)\n            render_historico_otif()\n        else:\n            with st.expander(f"ALIMENTAR · {name}", expanded=False):\n                st.caption("Estrutura preparada. A lógica de alimentação deste indicador será configurada na próxima etapa.")\n            with st.expander("CONSULTAR · HISTÓRICO DETALHADO", expanded=False):\n                st.caption("Estrutura preparada. O histórico detalhado será habilitado quando a regra deste indicador for construída.")\n'''
          if old not in s:
              raise SystemExit('Bloco de ações atual não encontrado')
          s = s.replace(old, new, 1)

          old_css = '.ind-actions-title{font-size:10px;font-weight:900;color:#a8b0ac;letter-spacing:.65px;text-transform:uppercase;margin:14px 2px 7px;padding-top:11px;border-top:1px solid #26342e}'
          new_css = '.ind-actions-title{font-size:10px;font-weight:900;color:#a8b0ac;letter-spacing:.65px;text-transform:uppercase;margin:14px 2px 7px;padding-top:11px;border-top:1px solid #26342e}\\n    div[data-testid="stExpander"]{margin-top:6px!important;margin-bottom:6px!important}\\n    div[data-testid="stExpander"] details summary{min-height:46px!important;display:flex!important;align-items:center!important}'
          if old_css not in s:
              raise SystemExit('CSS de ações não encontrado')
          s = s.replace(old_css, new_css, 1)

          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile indicadores_dashboard.py indicadores_entregas_v2.py indicadores_historico.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add indicadores_dashboard.py
          git commit -m 'Padroniza acoes dos tres indicadores'
          git rm .github/workflows/padroniza-acoes-indicadores.yml
          git commit -m 'Remove workflow temporario de layout'
          git push origin main
