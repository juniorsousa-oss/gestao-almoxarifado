name: Aplicar layout oficial de exportacao

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_export_official_v1.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python scripts/patch_export_official_v1.py
      - name: Validar sintaxe
        run: python -m py_compile indicadores_pdf.py
      - name: Commitar e limpar temporarios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch_export_official_v1.py .github/workflows/apply_export_official_v1.yml
          git add indicadores_pdf.py scripts/patch_export_official_v1.py .github/workflows/apply_export_official_v1.yml
          git commit -m "Consolida layout oficial A4 dos indicadores"
          git push
