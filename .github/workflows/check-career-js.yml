name: Check Plano de Carreira JS
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check plano-carreira-v2.js
      - name: Check index reference
        run: grep -n 'plano-carreira-v2.js' index.html
