name: Ajustar sidebar

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adjust-sidebar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Subir botoes da sidebar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('streamlit_app.py')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'padding:1px 9px 20px;overflow:hidden !important;': 'padding:0 9px 16px;overflow:hidden !important;',
              'margin:0 0 8px 0}}': 'margin:0 0 6px 0}}',
              'margin:8px 0 8px;padding:0 0 9px;': 'margin:0 0 3px;padding:0 0 5px;',
          }

          new_text = text
          for old, new in replacements.items():
              new_text = new_text.replace(old, new)

          if new_text == text:
              print('Nenhuma alteracao necessaria.')
          else:
              path.write_text(new_text, encoding='utf-8')
              print('Sidebar ajustada: botoes movidos para cima e espacamento superior reduzido.')
          PY

      - name: Validar Python
        run: python -m py_compile streamlit_app.py

      - name: Commitar ajuste
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao para commitar."
            exit 0
          fi
          git commit -m "fix: subir botoes da sidebar"
          git push
