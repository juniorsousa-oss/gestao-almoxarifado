name: Ajustar fundo da logo

on:
  push:
    branches: [main]

jobs:
  ajuste:
    if: ${{ !contains(github.event.head_commit.message, 'Ajusta fundo dinâmico da logo') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar código
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('streamlit_app.py')
          s = p.read_text(encoding='utf-8')

          old = '''.sidebar-logo-wrap{{width:190px;height:82px;box-sizing:border-box;display:flex;justify-content:center;align-items:center;background:var(--logo-bg);border:1px solid #e5e7eb;border-radius:12px;padding:6px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}}'''
          new = '''.sidebar-logo-wrap{{width:190px;height:82px;box-sizing:border-box;display:flex;justify-content:center;align-items:center;background:var(--logo-bg);border:1px solid var(--logo-border);border-radius:12px;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}}'''
          if old not in s:
              raise SystemExit('CSS da logo não encontrado')
          s = s.replace(old, new, 1)

          old = '''.sidebar-logo-img{{display:block;max-width:176px;max-height:70px;width:auto;height:auto;object-fit:contain;margin:auto}}'''
          new = '''.sidebar-logo-img{{display:block;width:100%;height:100%;max-width:none;max-height:none;object-fit:contain;margin:auto}}'''
          if old not in s:
              raise SystemExit('CSS da imagem da logo não encontrado')
          s = s.replace(old, new, 1)

          old = '''    logo_b64 = config.get("logo_base64")\n    logo_bg = "#101513" if IS_LIGHT else "#ffffff"\n    if logo_b64:'''
          new = '''    logo_b64 = config.get("logo_base64")\n    if logo_b64:\n        # Detecta automaticamente o fundo da própria imagem para que o\n        # "balão" acompanhe a identidade visual da logo (preto, branco etc.).\n        logo_bg = detectar_cor_fundo_logo(logo_b64, config.get("logo_mime"))\n        try:\n            r, g, b = int(logo_bg[1:3], 16), int(logo_bg[3:5], 16), int(logo_bg[5:7], 16)\n            luminancia = (0.299 * r) + (0.587 * g) + (0.114 * b)\n            logo_border = "#555555" if luminancia < 150 else "#e5e7eb"\n        except Exception:\n            logo_border = "#e5e7eb"\n    else:\n        logo_bg = "#101513" if IS_LIGHT else "#ffffff"\n        logo_border = "#e5e7eb"\n    if logo_b64:'''
          if old not in s:
              raise SystemExit('Bloco de renderização da logo não encontrado')
          s = s.replace(old, new, 1)

          old = '''<div class="sidebar-logo-section"><div class="sidebar-logo-wrap" style="--logo-bg:{logo_bg};">{logo_html}</div></div>'''
          new = '''<div class="sidebar-logo-section"><div class="sidebar-logo-wrap" style="--logo-bg:{logo_bg};--logo-border:{logo_border};">{logo_html}</div></div>'''
          if old not in s:
              raise SystemExit('HTML do balão da logo não encontrado')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commitar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Ajusta fundo dinâmico da logo"
          git push
