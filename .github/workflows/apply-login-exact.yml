name: Apply login exact
on:
  push:
    paths:
      - '.github/trigger-login-exact.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python patch_login_exact.py
      - name: Commit result and cleanup
        run: |
          rm -f patch_login_exact.py .github/workflows/apply-login-exact.yml .github/trigger-login-exact.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Corrige login do Gestão para padrão 1 a 1 do MRP'
          git push
