name: Corrigir Pre Nota OTIF v5
on:
  push:
    paths:
      - '.github/workflows/fix-pre-nota-v5.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Corrigir regra de compra
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('indicadores_entregas_v2.py')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              'LOGIC_VERSION = "2026-09-11-otif-almox-funil-v4"',
              'LOGIC_VERSION = "2026-09-11-otif-almox-funil-v5"'
          )

          old = '    out["Compra"] = out["Pré Nota"] + out["P.C."]\n'
          new = (
              '    # Pré Nota é subconjunto do P.C.; nunca somar os dois.\\n'
              '    # MAX preserva a classificação quando a Ação detalha apenas um dos estágios,\\n'
              '    # sem inflar a quantidade de compra quando ambos aparecem.\\n'
              '    out["Compra"] = max(out["Pré Nota"], out["P.C."])\\n'
          ).replace('\\n', '\n')
          if old not in s:
              raise SystemExit('Regra antiga de Compra não encontrada')
          s = s.replace(old, new, 1)

          s = s.replace(
              '["Fora On Time Almox · Compra (Pré Nota + P.C.)",',
              '["Fora On Time Almox · Compra (P.C.; Pré Nota já contida)",'
          )
          s = s.replace(
              '["Pré Nota", "Mesma família de P.C.; ambos são classificados como COMPRA e não representam estoque disponível."],',
              '["Pré Nota", "É subconjunto do P.C. e não é somada a ele. Para a causa COMPRA, usa-se uma única quantidade: o maior valor identificado entre P.C. e Pré Nota na Ação, evitando dupla contagem."],'
          )
          s = s.replace('"origem": "otif_almox_funil_v4"', '"origem": "otif_almox_funil_v5"')

          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile indicadores_entregas_v2.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add indicadores_entregas_v2.py
          git commit -m 'Evita dupla contagem de Pre Nota e PC no OTIF'
          git push origin main
