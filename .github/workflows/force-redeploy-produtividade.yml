name: Force redeploy produtividade

on:
  push:
    paths:
      - 'scripts/force_redeploy_produtividade.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deploy marker
        run: python scripts/force_redeploy_produtividade.py
      - name: Validate Python
        run: python -m py_compile streamlit_app.py indicadores_dashboard.py indicadores_pdf.py
      - name: Commit deploy marker and cleanup
        run: |
          rm -f scripts/force_redeploy_produtividade.py .github/workflows/force-redeploy-produtividade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py scripts/force_redeploy_produtividade.py .github/workflows/force-redeploy-produtividade.yml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Forca redeploy do indicador Produtividade"
            git push
          fi
