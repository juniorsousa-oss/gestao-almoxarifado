name: Ajustar logo da sidebar

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Subir logo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('streamlit_app.py')
          s = p.read_text(encoding='utf-8')
          old = '.sidebar-logo-section{{width:100%;display:flex;flex-direction:column;align-items:center;margin:0 0 3px;padding:0 0 5px;border-bottom:1px solid {BORDER}}}'
          new = '.sidebar-logo-section{{width:100%;display:flex;flex-direction:column;align-items:center;margin:-20px 0 3px;padding:0 0 5px;border-bottom:1px solid {BORDER}}}'
          if old not in s:
              raise SystemExit('Regra da logo nao encontrada; nenhuma alteracao aplicada.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile streamlit_app.py
      - name: Commitar e remover workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/move-logo-up.yml
          git add streamlit_app.py
          git commit -m "fix: subir logo da sidebar"
          git push
