name: Apply Entregas Auditoria
on:
  push:
    paths:
      - '.github/workflows/apply-entregas-auditoria.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply audit module
        shell: python
        run: |
          import base64, gzip
          from pathlib import Path
          payload = ''''''
          Path('indicadores_entregas_auditoria.py').write_bytes(gzip.decompress(base64.b64decode(payload)))
          p = Path('indicadores_dashboard.py')
          s = p.read_text(encoding='utf-8')
          old_import = 'from indicadores_entregas import render_alimentacao_entregas'
          new_import = 'from indicadores_entregas_auditoria import render_alimentacao_entregas_auditoria'
          if old_import in s:
              s = s.replace(old_import, new_import)
          elif new_import not in s:
              raise SystemExit('Import esperado não encontrado')
          old_call = '    render_alimentacao_entregas(indicadores)'
          new_call = '    render_alimentacao_entregas_auditoria(indicadores)'
          if old_call in s:
              s = s.replace(old_call, new_call)
          elif new_call not in s:
              raise SystemExit('Chamada esperada não encontrada')
          p.write_text(s, encoding='utf-8')
      - name: Validate Python
        run: python -m py_compile indicadores_entregas_auditoria.py indicadores_dashboard.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicadores_entregas_auditoria.py indicadores_dashboard.py
          git diff --cached --quiet || git commit -m "Adiciona auditoria Excel e data automática em entregas"
          git push
