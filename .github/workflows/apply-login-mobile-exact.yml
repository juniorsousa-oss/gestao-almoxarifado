name: Apply login mobile exact
on:
  push:
    paths:
      - '.github/trigger-login-mobile-exact.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python patch_login_mobile_exact.py
          python -m py_compile controle_acesso.py
      - name: Commit result and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f patch_login_mobile_exact.py .github/trigger-login-mobile-exact.txt .github/workflows/apply-login-mobile-exact.yml
          git add controle_acesso.py patch_login_mobile_exact.py .github/trigger-login-mobile-exact.txt .github/workflows/apply-login-mobile-exact.yml || true
          git diff --cached --quiet || git commit -m 'Ajusta escala móvel e remove borda dupla do login'
          git push
