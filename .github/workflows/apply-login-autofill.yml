name: Apply login autofill
on:
  push:
    paths:
      - '.github/trigger-login-autofill.txt'
      - 'patch_login_autofill.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python patch_login_autofill.py
      - name: Validate Python
        run: python -m py_compile controle_acesso.py
      - name: Commit result and cleanup
        run: |
          rm -f patch_login_autofill.py .github/workflows/apply-login-autofill.yml .github/trigger-login-autofill.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Habilita sugestão de senha no login'
          git push
