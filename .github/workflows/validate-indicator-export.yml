name: Validar exportacao indicadores
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-indicator-export.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe
        run: python -m py_compile indicadores_regras.py indicadores_dashboard.py indicadores_pdf.py
      - name: Validar corte mensal
        run: |
          python - <<'PY'
          from indicadores_regras import preparar_exportacao
          rows = [
              {'indicador':'5S','competencia':'2026-01-10','valor':10,'meta':20},
              {'indicador':'5S','competencia':'2026-01-25','valor':15,'meta':20},
              {'indicador':'5S','competencia':'2026-02-15','valor':30,'meta':25},
              {'indicador':'5S','competencia':'2026-03-20','valor':40,'meta':30},
          ]
          atual = preparar_exportacao(rows, 'ATUAL')
          marco = preparar_exportacao(rows, 'MÊS ESPECÍFICO', '2026-03')
          fevereiro = preparar_exportacao(rows, 'MÊS ESPECÍFICO', '2026-02')
          assert [r['valor'] for r in atual] == [15, 30, 40]
          assert [r['valor'] for r in marco] == [15, 30, 40]
          assert [r['valor'] for r in fevereiro] == [15, 30]
          PY
      - name: Remover workflow temporario
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-indicator-export.yml
          git commit -m "Remove validacao temporaria da exportacao"
          git push
