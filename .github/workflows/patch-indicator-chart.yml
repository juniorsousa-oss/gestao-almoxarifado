name: Patch indicator chart
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove invalid Plotly selected marker config
        shell: python
        run: |
          from pathlib import Path
          p=Path('indicadores_dashboard.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('        selected=dict(marker=dict(opacity=1, line=dict(color="#ffffff", width=2))),\n','')
          s=s.replace('        unselected=dict(marker=dict(opacity=.72)),\n','')
          p.write_text(s,encoding='utf-8')
      - name: Validate
        run: python -m py_compile indicadores_dashboard.py
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add indicadores_dashboard.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: remover propriedade inválida do gráfico Plotly'
          git push
