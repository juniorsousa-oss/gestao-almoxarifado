name: Aplicar tipografia exportacao

on:
  push:
    paths:
      - scripts/patch_export_typography.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python scripts/patch_export_typography.py
      - name: Validar sintaxe
        run: python -m py_compile indicadores_pdf.py indicadores_dashboard.py
      - name: Commitar alteracao e limpar temporarios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicadores_pdf.py
          git rm scripts/patch_export_typography.py .github/workflows/apply-export-typography.yml
          git commit -m "Corrige escala tipografica da exportacao"
          git push
