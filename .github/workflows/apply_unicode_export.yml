name: Apply Unicode export fix

on:
  push:
    paths:
      - 'scripts/patch_unicode_export.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: python scripts/patch_unicode_export.py
      - name: Validate syntax
        run: python -m py_compile indicadores_pdf.py
      - name: Commit production fix and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/patch_unicode_export.py .github/workflows/apply_unicode_export.yml
          git add indicadores_pdf.py
          git commit -m "Corrige Unicode e acabamento da exportacao"
          git push
