name: Aplicar cabeçalho padrão
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar alterações
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('streamlit_app.py')
          s=p.read_text(encoding='utf-8')
          old='.hero{{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}}.hero h1{{margin:0;font-family:{fontes["titulo"]},sans-serif;font-size:30px;color:{TEXT}}}.hero p,.muted{{font-family:{fontes["subtitulo"]},sans-serif;color:{MUTED}}}.period{{background:{PRIMARY};color:#111;padding:10px 15px;border-radius:9px;font-weight:900;text-transform:uppercase}}'
          new='.hero{{display:flex;justify-content:space-between;align-items:center;gap:24px;margin:10px 0 24px;padding:20px 22px;border:1px solid {BORDER};border-radius:16px;background:linear-gradient(145deg,{PANEL},#0d1210);box-sizing:border-box;min-height:112px}}.hero h1{{margin:0;font-family:{fontes["titulo"]},sans-serif;font-size:30px;line-height:1.1;font-weight:900;color:{TEXT};text-transform:uppercase;letter-spacing:.3px}}.hero p,.muted{{font-family:{fontes["subtitulo"]},sans-serif;color:{MUTED}}}.hero p{{margin:8px 0 0;font-size:14px;line-height:1.4}}.period{{background:{PRIMARY};color:#111;padding:12px 18px;border-radius:10px;font-weight:900;text-transform:uppercase;white-space:nowrap;font-size:14px}}'
          if old not in s: raise SystemExit('hero CSS não encontrado')
          s=s.replace(old,new,1)
          s=s.replace('"titulo_indicadores":"Alimentar Indicadores"','"titulo_indicadores":"Indicadores Operacionais"',1)
          p.write_text(s,encoding='utf-8')
          p=Path('indicadores_dashboard.py')
          s=p.read_text(encoding='utf-8')
          old2='    head_left, head_right = st.columns([5.5, 1.5], gap="medium")\n    with head_left:\n        st.markdown(\'<div class="ind-page-title">INDICADORES OPERACIONAIS</div><div class="ind-page-sub">Acompanhamento dos principais indicadores do almoxarifado.</div>\', unsafe_allow_html=True)\n    with head_right:'
          new2='    head_left, head_right = st.columns([5.5, 1.5], gap="medium")\n    with head_left:\n        st.markdown(\'<div class="ind-page-spacer"></div>\', unsafe_allow_html=True)\n    with head_right:'
          if old2 not in s: raise SystemExit('header indicadores não encontrado')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar
        run: python -m py_compile streamlit_app.py indicadores_dashboard.py
      - name: Publicar
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add streamlit_app.py indicadores_dashboard.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: padronizar cabeçalhos das páginas [skip ci]'
          git push
