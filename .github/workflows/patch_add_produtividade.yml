name: Aplicar indicador Produtividade

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_add_produtividade.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python scripts/patch_add_produtividade.py
      - name: Validar sintaxe
        run: python -m py_compile indicadores_dashboard.py indicadores_pdf.py
      - name: Commitar e limpar temporários
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicadores_dashboard.py indicadores_pdf.py
          git rm scripts/patch_add_produtividade.py .github/workflows/patch_add_produtividade.yml
          git commit -m "Adiciona indicador Produtividade" || exit 0
          git push
