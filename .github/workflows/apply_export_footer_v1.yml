name: Ajuste final rodape exportacao

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_export_footer_v1.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_export_footer_v1.py
      - run: python -m py_compile indicadores_pdf.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch_export_footer_v1.py .github/workflows/apply_export_footer_v1.yml
          git add indicadores_pdf.py scripts/patch_export_footer_v1.py .github/workflows/apply_export_footer_v1.yml
          git commit -m "Finaliza refinamentos do layout oficial A4"
          git push
