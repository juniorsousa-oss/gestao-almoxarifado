name: Fix export button position
on:
  push:
    paths:
      - '.github/trigger-export-position.txt'
      - '.github/workflows/fix-export-position.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move export block to bottom
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('indicadores_dashboard.py')
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(r'(?ms)^    head_left, head_right = st\.columns\(\[5\.5, 1\.5\], gap="medium"\)\n.*?^    for i, \(name, rows\) in enumerate\(groups\.items\(\), 1\):\n^        _render_indicator\(name, rows, i\)')
          m = pattern.search(text)
          if not m:
              print('Exportação já está no final ou layout já corrigido.')
              raise SystemExit(0)
          block = m.group(0)
          loop_marker = '    for i, (name, rows) in enumerate(groups.items(), 1):\n        _render_indicator(name, rows, i)'
          export_block = block[:block.index(loop_marker)]
          replacement = loop_marker + '\n\n    # Divulgação/exportação fica depois de todos os indicadores.\n' + export_block.rstrip() + '\n'
          text = text[:m.start()] + replacement + text[m.end():]
          p.write_text(text, encoding='utf-8')
          print('Exportação movida para o final da página.')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add indicadores_dashboard.py
          git diff --cached --quiet || git commit -m 'fix: mover exportacao para o final da pagina'
          git push
