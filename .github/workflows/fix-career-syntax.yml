name: Fix Plano de Carreira syntax
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix invalid template expression
        shell: python
        run: |
          from pathlib import Path
          p=Path('plano-carreira-v2.js')
          lines=p.read_text(encoding='utf-8').splitlines()
          replacement="""window.careerAssess=(pid,plid)=>{const p=people().find(x=>String(x.id)===String(pid)),pl=career()?.plans.find(x=>String(x.id)===String(plid));if(!p||!pl)return;const a=assessment(pid,plid);const items=(pl.requirements||[]).map((r,i)=>'<div class=\"assessment\"><div><b>'+esc((i+1)+'. '+r.label)+'</b><small>'+esc(r.type||'Critério')+'</small></div><button id=\"ca_'+esc(r.id)+'\" class=\"'+(a[String(r.id)]===true?'ok':'')+'\" onclick=\"careerToggle(\\''+esc(pid)+'\\',\\''+esc(plid)+'\\',\\''+esc(r.id)+'\\')\">'+(a[String(r.id)]===true?'CUMPRIDO':'PENDENTE')+'</button></div>').join('');const body='<div class=\"career-muted\" style=\"margin-bottom:12px\">'+esc(p.name||'')+' · '+esc(pl.name)+'</div>'+(items||'<div class=\"career-muted\">Nenhum pré-requisito cadastrado.</div>');modal('careerAssessmentModal','AVALIAÇÃO DE PRONTIDÃO',body,'<button class=\"btn btn-primary\" onclick=\"careerClose(\\'careerAssessmentModal\\');render()\">CONCLUIR AVALIAÇÃO</button>')};"""
          found=False
          for i,line in enumerate(lines):
              if line.startswith('window.careerAssess='):
                  lines[i]=replacement
                  found=True
                  break
          if not found:
              raise SystemExit('Linha careerAssess não encontrada')
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
      - name: Apply Gestão de Equipes visual
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/update-equipes-visual.yml')
          if not wf.exists():
              raise SystemExit('Patch visual temporário não encontrado')
          text = wf.read_text(encoding='utf-8')
          marker = "          block = '''"
          if marker not in text:
              raise SystemExit('Bloco visual não encontrado')
          block = text.split(marker,1)[1].split("'''",1)[0]
          p = Path('streamlit_app.py')
          s = p.read_text(encoding='utf-8')
          start = 'elif pagina == "equipes":\n'
          end = '\nelif pagina == "carreira":'
          i = s.find(start)
          j = s.find(end, i)
          if i < 0 or j < 0:
              raise SystemExit('Bloco Gestão de Equipes não encontrado')
          if 'tab_geral, tab_equipes, tab_colaboradores = st.tabs(["VISÃO GERAL", "EQUIPES", "COLABORADORES"])' not in s:
              s = s[:i] + block + s[j:]
              p.write_text(s, encoding='utf-8')
          else:
              print('Gestão de Equipes já atualizada')
          PY
      - name: Validate
        run: |
          python -m py_compile streamlit_app.py
          node --check plano-carreira-v2.js
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/update-equipes-visual.yml .github/workflows/run-equipes-visual.yml
          git add streamlit_app.py plano-carreira-v2.js .github/workflows/fix-career-syntax.yml .github/workflows/update-equipes-visual.yml .github/workflows/run-equipes-visual.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: adiciona visão geral e visualiza equipes e colaboradores'
          git push
