name: Fix Plano de Carreira syntax
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corrigir chaves CSS do bloco de admissões
        shell: python
        run: |
          from pathlib import Path
          p = Path('streamlit_app.py')
          s = p.read_text(encoding='utf-8')
          start = s.find('/* Cartão clicável */')
          end = s.find('.ge-click-card{{', start)
          if start < 0 or end < 0:
              raise SystemExit('Bloco CSS de admissões não encontrado.')
          block = s[start:end]
          import re
          block = re.sub(r'(?<!\{)\{', '{{', block)
          block = re.sub(r'(?<!\})\}', '}}', block)
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8')
      - name: Garantir botão de abrir menu visível
        shell: python
        run: |
          from pathlib import Path
          p = Path('streamlit_app.py')
          s = p.read_text(encoding='utf-8')
          old = 'div[data-testid="collapsedControl"]{{position:fixed !important;top:10px !important;'
          new = 'div[data-testid="collapsedControl"]{{display:flex !important;visibility:visible !important;opacity:1 !important;pointer-events:auto !important;position:fixed !important;top:10px !important;'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Seletor collapsedControl não encontrado.')
          p.write_text(s, encoding='utf-8')
      - name: Validar Python
        run: python -m py_compile streamlit_app.py
      - name: Publicar
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'fix: corrigir chaves CSS do Streamlit [skip ci]'
          git push
