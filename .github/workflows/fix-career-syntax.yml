name: Corrigir sintaxe do Plano de Carreira

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir fechamento da função careerEditPlan
        shell: python
        run: |
          from pathlib import Path
          path = Path('plano-carreira-v2.js')
          text = path.read_text(encoding='utf-8')
          old = "SALVAR</button>`)}};"
          new = "SALVAR</button>`);};"
          if old not in text:
              raise SystemExit('Padrão de sintaxe não encontrado; nenhuma alteração feita.')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          print('Sintaxe corrigida.')

      - name: Publicar correção
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plano-carreira-v2.js
          git commit -m "fix: corrigir sintaxe do plano de carreira"
          git push

      - name: Remover workflow temporário
        shell: bash
        run: |
          git rm .github/workflows/fix-career-syntax.yml
          git commit -m "chore: remover workflow temporário"
          git push