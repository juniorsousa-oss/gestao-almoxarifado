name: Remove top menu
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  remove:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remover header e toolbar superiores
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('streamlit_app.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('header[data-testid="stHeader"]{{display:block !important;background:#ffffff !important;height:30px !important;min-height:30px !important;border:0 !important;box-shadow:none !important;}}', 'header[data-testid="stHeader"]{{display:none !important;height:0 !important;min-height:0 !important;border:0 !important;box-shadow:none !important;}}')
          s = s.replace('[data-testid="stToolbar"]{{display:flex !important;align-items:center !important;justify-content:flex-end !important;height:30px !important;min-height:30px !important;padding:0 8px !important;gap:2px !important;transform:none !important;}}', '[data-testid="stToolbar"]{{display:none !important;height:0 !important;min-height:0 !important;}}')
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile streamlit_app.py
      - name: Gravar correção
        shell: bash
        run: |
          rm -f .github/trigger-remove-top-menu.txt .github/workflows/remove-top-menu.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add streamlit_app.py .github/trigger-remove-top-menu.txt .github/workflows/remove-top-menu.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove menu superior [skip ci]'
          git push
