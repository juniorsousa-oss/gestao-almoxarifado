name: Ativar módulo de Plano de Carreira

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate-career:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inserir script do Plano de Carreira no index
        shell: python
        run: |
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          tag = '<script src="./plano-carreira-v2.js"></script>'
          if tag not in text:
              marker = "</body>"
              if marker not in text:
                  raise SystemExit("index.html não contém </body>")
              path.write_text(text.replace(marker, f"{tag}\n{marker}", 1), encoding="utf-8")

      - name: Corrigir botão de abrir menu após recolher
        shell: python
        run: |
          from pathlib import Path
          path = Path("streamlit_app.py")
          text = path.read_text(encoding="utf-8")

          replacements = {
              'button[data-testid="stSidebarCollapseButton"]{{display:none !important;visibility:hidden !important;pointer-events:none !important;}}': 'button[data-testid="stSidebarCollapseButton"]{{display:flex !important;visibility:visible !important;opacity:1 !important;pointer-events:auto !important;}}',
              'div[data-testid="collapsedControl"]{{display:none !important;visibility:hidden !important;opacity:0 !important;pointer-events:none !important;}}': 'div[data-testid="collapsedControl"]{{display:flex !important;visibility:visible !important;opacity:1 !important;pointer-events:auto !important;position:fixed !important;top:4px !important;left:8px !important;z-index:2147483647 !important;width:40px !important;height:28px !important;align-items:center !important;justify-content:center !important;background:#090c0b !important;}}',
              'div[data-testid="collapsedControl"] button{{display:none !important;}}': 'div[data-testid="collapsedControl"] button{{display:flex !important;visibility:visible !important;opacity:1 !important;pointer-events:auto !important;width:34px !important;height:28px !important;margin:0 !important;padding:0 !important;background:transparent !important;color:#f4f5f4 !important;border:0 !important;}}',
              'section[data-testid="stSidebar"][aria-expanded="false"]{{width:230px !important;min-width:230px !important;max-width:230px !important;}}': 'section[data-testid="stSidebar"][aria-expanded="false"]{{width:0 !important;min-width:0 !important;max-width:0 !important;}}',
              'section[data-testid="stSidebar"][aria-expanded="false"] > div:first-child{{width:230px !important;min-width:230px !important;padding:1px 9px 20px !important;}}': 'section[data-testid="stSidebar"][aria-expanded="false"] > div:first-child{{width:0 !important;min-width:0 !important;padding:0 !important;overflow:hidden !important;}}',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

      - name: Validar Python
        run: python -m py_compile streamlit_app.py

      - name: Publicar alterações no main
        shell: bash
        run: |
          rm -f .github/trigger-sidebar-button.txt
          if git diff --quiet -- index.html streamlit_app.py; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html streamlit_app.py
          git commit -m "fix: manter botão de abrir menu visível [skip ci]"
          git push
