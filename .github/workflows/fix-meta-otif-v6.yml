name: Automatizar Meta OTIF v6
on:
  push:
    paths:
      - '.github/workflows/fix-meta-otif-v6.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar meta mensal fixa
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('indicadores_entregas_v2.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('LOGIC_VERSION = "2026-09-11-otif-almox-funil-v5"', 'LOGIC_VERSION = "2026-09-11-otif-almox-funil-v6"')
          ini = s.index('def _ultima_meta(indicadores):')
          fim = s.index('\ndef _excel_safe(df):', ini)
          novo = 'def _meta_mensal(data_ref: date) -> float:\n    """Meta mensal oficial do OTIF Almox. Janeiro = 25,60% e +2,60 p.p. por mês."""\n    return round(25.60 + (int(data_ref.month) - 1) * 2.60, 2)\n'
          s = s[:ini] + novo + s[fim:]
          antigo = '        with m2:\n            meta = st.number_input("Meta OTIF Almox (%)", 0.0, 100.0, float(_ultima_meta(indicadores)), 0.1, key="otif_meta")\n'
          novo_ui = '        with m2:\n            meta = _meta_mensal(hoje)\n            st.number_input("Meta OTIF Almox (%)", min_value=0.0, max_value=100.0, value=float(meta), step=0.1, disabled=True, key="otif_meta")\n            st.caption(f"Meta automática do mês: {meta:.2f}% · evolução mensal de +2,60 p.p.")\n'
          if antigo not in s:
              raise SystemExit('Bloco da meta não encontrado')
          s = s.replace(antigo, novo_ui, 1)
          s = s.replace('"origem": "otif_almox_funil_v5"', '"origem": "otif_almox_funil_v6"')
          marker = '        ["OTIF Almox", "ON TIME ALMOX (%) × IN FULL ALMOX (%) / 100."],\n'
          meta_doc = '        ["Meta mensal", "Janeiro = 25,60%; acréscimo fixo de 2,60 pontos percentuais a cada mês. A meta é automática e não editável na alimentação."],\n'
          if marker in s and meta_doc not in s:
              s = s.replace(marker, marker + meta_doc, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile indicadores_entregas_v2.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add indicadores_entregas_v2.py
          git commit -m 'Define meta mensal automatica do OTIF Almox'
          git push origin main
