name: Fix layout superior

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Aplicar patch
        run: python scripts/fix_layout_header.py
      - name: Validar Python
        run: python -m py_compile streamlit_app.py
      - name: Commit e limpeza
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/fix_layout_header.py .github/workflows/fix-layout-header-temp.yml .github/trigger-layout-header.txt
          git add streamlit_app.py scripts/fix_layout_header.py .github/workflows/fix-layout-header-temp.yml .github/trigger-layout-header.txt
          git commit -m 'fix: remover menu superior e elevar cabecalho [skip ci]'
          git push
