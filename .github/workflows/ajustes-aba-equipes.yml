name: ajustes-aba-equipes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajustes solicitados
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('streamlit_app.py')
          s=p.read_text(encoding='utf-8')

          # 1) Organograma passa a ser a segunda aba.
          s=s.replace(
              'tab_geral,tab_equipes,tab_colaboradores,tab_organograma=st.tabs(["VISÃO GERAL","EQUIPES","COLABORADORES","ORGANOGRAMA"])',
              'tab_geral,tab_organograma,tab_equipes,tab_colaboradores=st.tabs(["VISÃO GERAL","ORGANOGRAMA","EQUIPES","COLABORADORES"])'
          )

          # 2) Alinhamento da área de admissões recentes.
          old='''        cards=[]\n        for c in recentes:\n            dt=pd.to_datetime(c.get("data_admissao"),errors="coerce");cards.append(f'<div style="text-align:center"><div>{foto_html(c,60)}</div><div style="font-weight:900;font-size:12px;margin-top:8px">{nome_curto(c.get("nome"))}</div><div class="muted" style="font-size:11px">{dt.strftime("%d/%m/%Y") if not pd.isna(dt) else "—"}</div></div>')\n        if cards:st.markdown('<div class="panel"><div class="ge-panel-title">ADMISSÕES MAIS RECENTES</div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:18px">'+''.join(cards)+'</div></div>',unsafe_allow_html=True)'''
          new='''        cards=[]\n        for c in recentes:\n            dt=pd.to_datetime(c.get("data_admissao"),errors="coerce")\n            data_txt=dt.strftime("%d/%m/%Y") if not pd.isna(dt) else "—"\n            cards.append(f'<div class="ge-admissao-card"><div class="ge-admissao-photo">{foto_html(c,60)}</div><div class="ge-admissao-name">{nome_curto(c.get("nome"))}</div><div class="ge-admissao-date">{data_txt}</div></div>')\n        if cards:st.markdown('<div class="panel ge-admissoes-panel"><div class="ge-panel-title">ADMISSÕES MAIS RECENTES</div><div class="ge-admissoes-grid">'+''.join(cards)+'</div></div>',unsafe_allow_html=True)'''
          if old in s:
              s=s.replace(old,new)
          else:
              print('Aviso: bloco de admissões não encontrado; mantendo versão atual.')

          # 3) Organograma: controles de hierarquia ficam somente dentro de uma opção de ajuste.
          start=s.find('    with tab_organograma:')
          end=s.find('\nelif pagina=="carreira":',start)
          if start!=-1 and end!=-1:
              block='''    with tab_organograma:\n        st.markdown('<div class="org-focus-head"><div><div class="org-focus-title">ORGANOGRAMA</div><div class="org-focus-sub">Estrutura hierárquica visual do almoxarifado.</div></div></div>',unsafe_allow_html=True)\n        people=ativos_colaboradores\n        ids=[str(c.get("id")) for c in people]\n        byid={str(c.get("id")):c for c in people}\n        org=config.get("organograma",{})\n        saved_parents={str(k):str(v) for k,v in (org.get("pais") or {}).items()}\n        saved_parents={k:v for k,v in saved_parents.items() if k in ids and v in ids and k!=v}\n        saved_root=str(org.get("raiz_id")) if str(org.get("raiz_id")) in ids else (ids[0] if ids else "")\n\n        if people:\n            def org_node(c,isroot=False):\n                photo=foto_html(c,58)\n                return f'<div class="org-node {"root" if isroot else ""}">{photo}<strong>{c.get("nome","")}</strong><small>{c.get("funcao") or "Sem função"}</small></div>'\n\n            def build_children(parents,root_id):\n                children=defaultdict(list)\n                for cid in ids:\n                    if cid==root_id: continue\n                    pid=parents.get(cid,"")\n                    if pid and pid in ids and pid!=cid:\n                        children[pid].append(cid)\n                    else:\n                        children[root_id].append(cid)\n                return children\n\n            def render_children(pid,children):\n                kids=children.get(pid,[])\n                if not kids:return ""\n                inner=""\n                for kid in kids:\n                    inner+=f'<div class="org-child"><div class="org-connector"></div>{org_node(byid[kid])}{render_children(kid,children)}</div>'\n                return f'<div class="org-children">{inner}</div>'\n\n            children=build_children(saved_parents,saved_root)\n            st.markdown(f'<div class="org-wrap org-main"><div class="org-title">{org.get("titulo") or "ORGANOGRAMA DO ALMOXARIFADO"}</div><div class="org-tree">{org_node(byid[saved_root],True)}<div class="org-connector"></div>{render_children(saved_root,children)}</div></div>',unsafe_allow_html=True)\n\n            with st.expander("⚙ AJUSTAR ORGANOGRAMA",expanded=False):\n                root_opts={f"{c.get('nome','')} — {(c.get('funcao') or 'Sem função').upper()}":str(c.get('id')) for c in people}\n                root_labels=list(root_opts.keys())\n                root_index=list(root_opts.values()).index(saved_root) if saved_root in root_opts.values() else 0\n                titulo_org=st.text_input("Título",value=org.get("titulo") or "ORGANOGRAMA DO ALMOXARIFADO",key="org_titulo_ajuste")\n                root_label=st.selectbox("Responsável / raiz",root_labels,index=root_index,key="org_root_ajuste")\n                draft_root=str(root_opts[root_label])\n                st.caption("Defina o superior imediato de cada colaborador. A visualização principal mostra apenas o organograma; estes controles ficam ocultos até o ajuste.")\n                novas_pais={}\n                for c in people:\n                    cid=str(c.get("id"))\n                    options={"NÍVEL 1 — RAIZ":""}\n                    for superior in people:\n                        sid=str(superior.get("id"))\n                        if sid!=cid:\n                            options[f"{nome_curto(superior.get('nome'))} — {(superior.get('funcao') or 'Sem função').upper()}"]=sid\n                    atual=saved_parents.get(cid,"")\n                    vals=list(options.values());idx=vals.index(atual) if atual in vals else 0\n                    escolha=st.selectbox(f"{c.get('nome','')} · {c.get('funcao') or 'Sem função'}",list(options.keys()),index=idx,key=f"org_parent_ajuste_{cid}")\n                    novas_pais[cid]=options[escolha]\n\n                def has_cycle(start_id,parents):\n                    seen=set();cur=start_id\n                    while cur:\n                        if cur in seen:return True\n                        seen.add(cur);cur=parents.get(cur,"")\n                    return False\n\n                for cid in list(novas_pais):\n                    if cid!=draft_root and has_cycle(cid,novas_pais):\n                        novas_pais[cid]=""\n                    if cid==draft_root:\n                        novas_pais[cid]=""\n\n                if st.button("SALVAR ORGANOGRAMA",type="primary",use_container_width=True,key="salvar_org_ajuste"):\n                    config["organograma"]={"titulo":titulo_org.strip() or "ORGANOGRAMA DO ALMOXARIFADO","raiz_id":draft_root,"pais":novas_pais}\n                    if save_global_config():\n                        registrar_historico("organograma_atualizado","Organograma atualizado",{"raiz_id":draft_root,"colaboradores":len(people)})\n                        st.success("Organograma salvo.")\n                        st.rerun()\n                    else:\n                        st.error("Não foi possível salvar o organograma.")\n        else:\n            st.info("Cadastre colaboradores ativos para montar o organograma.")\n'''
              s=s[:start]+block+s[end:]
          else:
              print('Aviso: bloco do organograma não encontrado; mantendo versão atual.')

          # 4) Colaboradores: volta ao cartão visual, mas o próprio cartão é o controle de seleção.
          cstart=s.find('        if filtrados:\n',s.find('    with tab_colaboradores:'))
          cend=s.find('        escolhido=next(',cstart)
          if cstart!=-1 and cend!=-1:
              block='''        if filtrados:\n            selected_id=st.session_state.get("colab_selecionado")\n            for base in range(0,len(filtrados),5):\n                cols=st.columns(5)\n                for col,c in zip(cols,filtrados[base:base+5]):\n                    cid=str(c.get("id"))\n                    selecionado=selected_id==cid\n                    nome=c.get("nome") or "Sem nome"\n                    func=(c.get("funcao") or "Sem função").upper()\n                    equipe=nomes_eq.get(str(c.get("equipe_id")),c.get("equipe_atual") or "SEM EQUIPE")\n                    status_txt="ATIVO" if c.get("ativo",True) else "INATIVO"\n                    with col:\n                        if c.get("foto_base64"):\n                            mime=c.get("foto_mime") or "image/jpeg"\n                            css=f'''<style>div.st-key-card_colab_{cid} button{{background-image:url("data:{mime};base64,{c.get('foto_base64')}")!important;}}</style>'''\n                            st.markdown(css,unsafe_allow_html=True)\n                        label=f"{nome.upper()}\\n{func}\\n{equipe.upper()}\\n{status_txt} · {c.get('matricula') or 'SEM MATRÍCULA'}"\n                        if st.button(label,key=f"card_colab_{cid}",use_container_width=True,type="primary" if selecionado else "secondary"):\n                            st.session_state.colab_selecionado=cid\n                            st.rerun()\n        else:st.info("Nenhum colaborador encontrado.")\n'''
              s=s[:cstart]+block+s[cend:]
          else:
              print('Aviso: bloco dos colaboradores não encontrado; mantendo versão atual.')

          # 5) Cartões de colaborador: foto + texto dentro do mesmo botão, com alinhamento uniforme.
          css_anchor='.ge-click-card{{width:100%;border:1px solid #34413b!important;'
          if css_anchor in s:
              extra='''\n.ge-admissoes-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:stretch}.ge-admissao-card{text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}.ge-admissao-photo{height:70px;display:flex;align-items:center;justify-content:center}.ge-admissao-photo .ge-avatar-img,.ge-admissao-photo .ge-avatar-fallback{margin:auto}.ge-admissao-name{height:30px;display:flex;align-items:center;justify-content:center;width:100%;font-size:12px;font-weight:900;color:#f4f5f4;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ge-admissao-date{height:18px;font-size:11px;color:#9aa39f}.ge-admissoes-panel{padding:16px 18px 14px}.ge-admissoes-panel .ge-panel-title{margin-bottom:8px}.org-focus-head{margin:4px 0 12px}.org-focus-title{font-size:22px;font-weight:900;color:#f4f5f4;text-transform:uppercase}.org-focus-sub{font-size:12px;color:#8f9994;margin-top:4px}.org-main{min-height:620px;display:flex;flex-direction:column;justify-content:flex-start}.org-main .org-title{font-size:20px;margin-bottom:34px}.org-main .org-tree{padding-top:8px}.org-main .org-node{width:220px;padding:12px}.org-main .org-node strong{font-size:13px}.org-main .org-node small{font-size:10px}.org-main .org-children{gap:36px}.org-main .org-grandchildren{gap:14px}div[data-testid="stExpander"]{border:1px solid #34413b!important;border-radius:12px!important;background:#0d1210!important;margin-top:14px}.ge-person-button{height:245px!important}\n'''
              s=s.replace(css_anchor,extra+'\n'+css_anchor)

          # Alinhamento dos botões: início do texto sempre no mesmo ponto.
          s=s.replace(
              '[data-testid="stSidebar"] .stButton>button p{{color:inherit!important;margin:0!important}}',
              '[data-testid="stSidebar"] .stButton>button p{{color:inherit!important;margin:0!important;text-align:left!important;width:100%!important;display:block!important}} [data-testid="stSidebar"] .stButton>button>div{{width:100%!important;justify-content:flex-start!important}}'
          )
          s=s.replace(
              '.ge-click-card p{{white-space:pre-line!important;font-weight:900!important}}',
              '.ge-click-card p{{white-space:pre-line!important;font-weight:900!important}}\n/* Cartão clicável de colaborador */\ndiv[class*="st-key-card_colab_"] button{height:238px!important;min-height:238px!important;border-radius:16px!important;border:1px solid #34413b!important;background-color:#101513!important;background-repeat:no-repeat!important;background-position:center 15px!important;background-size:88px 88px!important;padding:116px 10px 10px!important;display:flex!important;align-items:flex-start!important;justify-content:center!important;text-align:center!important;white-space:pre-line!important;box-shadow:none!important;font-size:12px!important;font-weight:900!important;line-height:1.45!important;color:#f4f5f4!important}\ndiv[class*="st-key-card_colab_"] button:hover{border-color:#ffd43d!important}\ndiv[class*="st-key-card_colab_"] button[kind="primary"]{border:2px solid #ffd43d!important;background-color:#171b15!important}\ndiv[class*="st-key-card_colab_"] button p{white-space:pre-line!important;text-align:center!important;font-weight:900!important;width:100%!important}\n'
          )

          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile streamlit_app.py
      - name: Commit ajustes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add streamlit_app.py
          git diff --cached --quiet || git commit -m 'fix: ajustar equipes organograma colaboradores e alinhamento'
          git push
      - name: Remover workflow temporario
        run: |
          git rm .github/workflows/ajustes-aba-equipes.yml
          git commit -m 'chore: remover workflow temporario de ajustes'
          git push
