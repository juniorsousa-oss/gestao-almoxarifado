name: Ajuste visual de admissões

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  aplicar-ajuste:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar ajuste no painel de admissões
        shell: python
        run: |
          from pathlib import Path

          path = Path("streamlit_app.py")
          text = path.read_text(encoding="utf-8")

          inicio = text.find('        st.markdown(\'<div class="ge-overview-panel"><div class="ge-panel-title">Admissões mais recentes</div>\', unsafe_allow_html=True)')
          if inicio < 0:
              raise SystemExit("Início do bloco de admissões não encontrado; nenhuma alteração feita.")

          fim_marcador = '        st.markdown(\'</div>\', unsafe_allow_html=True)'
          fim = text.find(fim_marcador, inicio)
          if fim < 0:
              raise SystemExit("Fim do bloco de admissões não encontrado; nenhuma alteração feita.")
          fim += len(fim_marcador)

          novo_bloco = '''        recentes = sorted(
              [c for c in ativos_colaboradores if c.get("data_admissao")],
              key=lambda x: x.get("data_admissao") or "",
              reverse=True,
          )[:5]

          cards_admissoes = []
          for c in recentes:
              data = pd.to_datetime(c.get("data_admissao"), errors="coerce")
              data_txt = data.strftime("%d/%m/%Y") if not pd.isna(data) else "—"
              cards_admissoes.append(
                  '<div class="ge-admission-item">'
                  '<div class="ge-admission-photo">' + foto_html(c,54) + '</div>'
                  '<div class="ge-admission-name">' + nome_curto(c.get("nome")) + '</div>'
                  '<div class="ge-admission-date">' + data_txt + '</div>'
                  '</div>'
              )

          if cards_admissoes:
              st.markdown(
                  '<div class="ge-admissions-panel">'
                  '<div class="ge-admissions-title">Admissões mais recentes</div>'
                  '<div class="ge-admissions-grid">'
                  + ''.join(cards_admissoes) +
                  '</div></div>',
                  unsafe_allow_html=True,
              )
          else:
              st.markdown(
                  '<div class="ge-admissions-panel">'
                  '<div class="ge-admissions-title">Admissões mais recentes</div>'
                  '<div class="ge-empty">Nenhuma data de admissão cadastrada.</div>'
                  '</div>',
                  unsafe_allow_html=True,
              )'''

          text = text[:inicio] + novo_bloco + text[fim:]

          if ".ge-admissions-panel{" not in text:
              css = '''
          .ge-admissions-panel{
              background:linear-gradient(145deg,{PANEL},#0d1210);
              border:1px solid {BORDER};
              border-radius:15px;
              padding:22px;
              margin-top:14px;
          }
          .ge-admissions-title{
              color:{TEXT};
              font-size:16px;
              font-weight:900;
              letter-spacing:.4px;
              text-transform:uppercase;
              margin:0 0 22px;
          }
          .ge-admissions-grid{
              display:grid;
              grid-template-columns:repeat(5,minmax(0,1fr));
              gap:0;
              width:100%;
          }
          .ge-admission-item{
              min-width:0;
              text-align:center;
              padding:0 18px;
              border-left:1px solid {BORDER};
          }
          .ge-admission-item:first-child{
              border-left:0;
          }
          .ge-admission-photo{
              display:flex;
              justify-content:center;
              align-items:center;
              min-height:58px;
          }
          .ge-admission-name{
              margin-top:9px;
              color:{TEXT};
              font-size:11px;
              font-weight:900;
              line-height:1.25;
              white-space:nowrap;
              overflow:hidden;
              text-overflow:ellipsis;
          }
          .ge-admission-date{
              margin-top:4px;
              color:#89938e;
              font-size:9px;
          }
          @media (max-width:900px){
              .ge-admissions-grid{
                  grid-template-columns:repeat(2,minmax(0,1fr));
                  row-gap:20px;
              }
              .ge-admission-item:nth-child(3){
                  border-left:0;
              }
          }
          @media (max-width:560px){
              .ge-admissions-grid{
                  grid-template-columns:1fr;
              }
              .ge-admission-item{
                  border-left:0;
                  border-top:1px solid {BORDER};
                  padding:16px 0 0;
              }
              .ge-admission-item:first-child{
                  border-top:0;
                  padding-top:0;
              }
          }
          '''
              pos = text.find("</style>")
              if pos < 0:
                  raise SystemExit("Bloco CSS principal não encontrado; nenhuma alteração feita.")
              text = text[:pos] + css + text[pos:]

          path.write_text(text, encoding="utf-8")

      - name: Validar sintaxe Python
        run: python -m py_compile streamlit_app.py

      - name: Gravar alteração e remover workflow temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/ajuste-admissoes.yml .github/trigger-ajuste.txt
          git add streamlit_app.py .github/workflows/ajuste-admissoes.yml .github/trigger-ajuste.txt
          git diff --cached --quiet && exit 0
          git commit -m "fix: corrigir layout das admissões recentes"
          git push origin HEAD:main
