name: Aplicar personalização de textos e fontes

on:
  push:
    paths:
      - '.github/workflows/apply-text-font-settings.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Alterar streamlit_app.py
        shell: python
        run: |
          from pathlib import Path
          p = Path('streamlit_app.py')
          s = p.read_text(encoding='utf-8')

          # 1) Estruturas de textos e fontes persistidas no mesmo JSON de configuração.
          anchor = 'ESTILOS_BOTOES = ["Amarelo", "Colorido"]'
          insert = r'''

TEXTOS_PADRAO = {
    "menu_dashboard": "Dashboard",
    "menu_indicadores": "Alimentar Indicadores",
    "menu_historico": "Histórico",
    "menu_equipes": "Gestão de Equipes",
    "menu_carreira": "Plano de Carreira",
    "menu_configuracoes": "Configurações",
    "titulo_dashboard": "Dashboard",
    "titulo_indicadores": "Alimentar Indicadores",
    "titulo_historico": "Histórico",
    "titulo_equipes": "Gestão de Equipes",
    "titulo_carreira": "Plano de Carreira",
    "titulo_configuracoes": "Configurações",
    "subtitulo_global": "Gestão operacional do almoxarifado",
    "secao_dados_reais": "Dados reais do Supabase",
    "secao_indicadores": "Indicadores",
    "secao_historico": "Histórico real",
    "secao_colaboradores": "Colaboradores",
    "secao_equipes": "Equipes",
    "secao_organograma": "Organograma",
    "mensagem_sem_indicadores": "A tabela almox_indicadores está conectada, mas ainda não possui lançamentos.",
    "diagnostico": "Diagnóstico",
    "mensagem_indicadores": "Consulta do banco real habilitada. A gravação será liberada junto com autenticação adequada.",
    "titulo_plano": "Plano de carreira",
    "mensagem_carreira": "Módulo preparado para receber níveis, competências, metas e trilhas de desenvolvimento.",
    "rodape_linha1": "Gestão Operacional",
    "rodape_linha2": "SETTA • Streamlit + Supabase",
    "rodape_linha3": "Gestão Almoxarifado • Streamlit + Supabase • migração em andamento",
}

FONTES_PADRAO = {
    "menu": "Arial",
    "titulo": "Arial",
    "subtitulo": "Arial",
}
FONTES = ["Arial", "Verdana", "Trebuchet MS", "Georgia", "Courier New", "Times New Roman"]
'''
          if 'TEXTOS_PADRAO = {' not in s:
              s = s.replace(anchor, anchor + insert)

          # 2) Carrega as estruturas novas sem perder configurações antigas.
          old = '''config = st.session_state.config
PRIMARY = CORES.get(config.get("cor_principal"), CORES["Amarelo (Padrão)"])'''
          new = '''config = st.session_state.config
config.setdefault("textos", {})
config.setdefault("fontes", {})
for _k, _v in TEXTOS_PADRAO.items():
    config["textos"].setdefault(_k, _v)
for _k, _v in FONTES_PADRAO.items():
    config["fontes"].setdefault(_k, _v)
textos = config["textos"]
fontes = config["fontes"]
def txt(_k):
    return textos.get(_k, TEXTOS_PADRAO.get(_k, _k))
PRIMARY = CORES.get(config.get("cor_principal"), CORES["Amarelo (Padrão)"])'''
          if 'def txt(_k):' not in s:
              if old not in s:
                  raise SystemExit('Bloco config não encontrado')
              s = s.replace(old, new, 1)

          # 3) Fonte aplicada visualmente aos menus, títulos e subtítulos.
          s = s.replace('.hero h1{{margin:0;font-size:30px;color:{TEXT}}}', '.hero h1{{margin:0;font-family:{fontes["titulo"]},sans-serif;font-size:30px;color:{TEXT}}}')
          s = s.replace('.hero p,.muted{{color:{MUTED}}}', '.hero p,.muted{{font-family:{fontes["subtitulo"]},sans-serif;color:{MUTED}}}')
          s = s.replace('width:100%;min-height:48px;height:48px;border-radius:12px;border:1px solid {BORDER};background:{INPUT_BG};color:{TEXT} !important;font-size:14px;', 'width:100%;min-height:48px;height:48px;border-radius:12px;border:1px solid {BORDER};background:{INPUT_BG};color:{TEXT} !important;font-family:{fontes["menu"]},sans-serif;font-size:14px;')
          s = s.replace('font-size:14px;font-weight:900;letter-spacing:.15px;color:inherit !important;text-align:center !important;width:100%', 'font-family:{fontes["menu"]},sans-serif;font-size:14px;font-weight:900;letter-spacing:.15px;color:inherit !important;text-align:center !important;width:100%')

          # 4) IDs estáveis para a navegação, permitindo que o texto do botão seja alterado.
          old_pages = '''if "pagina" not in st.session_state:
    st.session_state.pagina = "Dashboard"

paginas = ["Dashboard", "Alimentar Indicadores", "Histórico", "Gestão de Equipes", "Plano de Carreira", "Configurações"]'''
          new_pages = '''if "pagina" not in st.session_state:
    st.session_state.pagina = "dashboard"

paginas_ids = ["dashboard", "indicadores", "historico", "equipes", "carreira", "configuracoes"]
paginas = [txt("menu_" + _id) for _id in paginas_ids]'''
          if old_pages in s:
              s = s.replace(old_pages, new_pages, 1)

          old_loop = '''    for p in paginas:
        ativo = st.session_state.pagina == p
        if st.button(p.upper(), use_container_width=True, type="primary" if ativo else "secondary", key=f"menu_{p}"):
            st.session_state.pagina = p
            st.rerun()'''
          new_loop = '''    for _id, p in zip(paginas_ids, paginas):
        ativo = st.session_state.pagina == _id
        if st.button(p.upper(), use_container_width=True, type="primary" if ativo else "secondary", key=f"menu_{_id}"):
            st.session_state.pagina = _id
            st.rerun()'''
          if old_loop in s:
              s = s.replace(old_loop, new_loop, 1)

          # 5) Hero usa título configurável e subtítulo configurável.
          old_hero = '''pagina = st.session_state.pagina
MESES_PT = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"]
competencia_atual = f"{MESES_PT[date.today().month - 1]}/{date.today().strftime('%y')}"
st.markdown(f'<div class="hero"><div><h1>{pagina}</h1><p>Gestão operacional do almoxarifado</p></div><div class="period">{competencia_atual}</div></div>', unsafe_allow_html=True)'''
          new_hero = '''pagina = st.session_state.pagina
if pagina not in paginas_ids:
    pagina = "dashboard"
    st.session_state.pagina = pagina
MESES_PT = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"]
competencia_atual = f"{MESES_PT[date.today().month - 1]}/{date.today().strftime('%y')}"
titulo_id = "titulo_" + pagina
st.markdown(f'<div class="hero"><div><h1>{txt(titulo_id)}</h1><p>{txt("subtitulo_global")}</p></div><div class="period">{competencia_atual}</div></div>', unsafe_allow_html=True)'''
          if old_hero in s:
              s = s.replace(old_hero, new_hero, 1)

          # 6) Condições das páginas passam a usar IDs estáveis.
          for a, b in [
              ('if pagina == "Dashboard":', 'if pagina == "dashboard":'),
              ('elif pagina == "Alimentar Indicadores":', 'elif pagina == "indicadores":'),
              ('elif pagina == "Histórico":', 'elif pagina == "historico":'),
              ('elif pagina == "Gestão de Equipes":', 'elif pagina == "equipes":'),
              ('elif pagina == "Plano de Carreira":', 'elif pagina == "carreira":'),
              ('elif pagina == "Configurações":', 'elif pagina == "configuracoes":'),
          ]:
              s = s.replace(a, b)

          # 7) Textos de seções e mensagens principais.
          replacements = [
              ("st.markdown('<div class=\"section\">Dados reais do Supabase</div>'", "st.markdown(f'<div class=\"section\">{txt(\"secao_dados_reais\")}</div>'"),
              ("st.markdown('<div class=\"section\">Indicadores</div>'", "st.markdown(f'<div class=\"section\">{txt(\"secao_indicadores\")}</div>'"),
              ("st.markdown('<div class=\"section\">Histórico real</div>'", "st.markdown(f'<div class=\"section\">{txt(\"secao_historico\")}</div>'"),
              ("st.markdown('<div class=\"section\">Colaboradores</div>'", "st.markdown(f'<div class=\"section\">{txt(\"secao_colaboradores\")}</div>'"),
              ("st.markdown('<div class=\"section\">Equipes</div>'", "st.markdown(f'<div class=\"section\">{txt(\"secao_equipes\")}</div>'"),
              ("st.markdown('<div class=\"section\">Organograma</div>'", "st.markdown(f'<div class=\"section\">{txt(\"secao_organograma\")}</div>'"),
              ('with st.expander("Diagnóstico"):', 'with st.expander(txt("diagnostico")):'),
              ('st.info("A tabela almox_indicadores está conectada, mas ainda não possui lançamentos.")', 'st.info(txt("mensagem_sem_indicadores"))'),
              ('st.markdown(\'<div class="notice">Consulta do banco real habilitada. A gravação será liberada junto com autenticação adequada.</div>\'', 'st.markdown(f\'<div class="notice">{txt("mensagem_indicadores")}</div>\''),
              ('st.markdown(\'<div class="section">Plano de carreira</div>\'', 'st.markdown(f\'<div class="section">{txt("titulo_plano")}</div>\''),
              ('st.info("Módulo preparado para receber níveis, competências, metas e trilhas de desenvolvimento.")', 'st.info(txt("mensagem_carreira"))'),
          ]
          for a, b in replacements:
              s = s.replace(a, b)

          # 8) Configurações: painel de edição de textos e fontes.
          marker = '''elif pagina == "configuracoes":'''
          if marker not in s:
              raise SystemExit('Página de configurações não encontrada')
          config_marker = '''    st.markdown('<div class="section">Configurações</div>', unsafe_allow_html=True)'''
          block = '''    st.markdown('<div class="section">Configurações</div>', unsafe_allow_html=True)
    st.markdown("### Personalização de textos")
    st.caption("Altere os nomes dos menus, títulos, subtítulo e seções. As alterações ficam salvas no Supabase.")

    novo_textos = textos.copy()
    novo_fontes = fontes.copy()
    pc1, pc2 = st.columns(2)
    with pc1:
        st.markdown("**Menus da barra lateral**")
        for _id, _rotulo in [
            ("dashboard", "Dashboard"),
            ("indicadores", "Alimentar Indicadores"),
            ("historico", "Histórico"),
            ("equipes", "Gestão de Equipes"),
            ("carreira", "Plano de Carreira"),
            ("configuracoes", "Configurações"),
        ]:
            _chave = "menu_" + _id
            novo_textos[_chave] = st.text_input(_rotulo, value=textos[_chave], key="edit_" + _chave)

        st.markdown("**Títulos das páginas**")
        for _id, _rotulo in [
            ("dashboard", "Título Dashboard"),
            ("indicadores", "Título Alimentar Indicadores"),
            ("historico", "Título Histórico"),
            ("equipes", "Título Gestão de Equipes"),
            ("carreira", "Título Plano de Carreira"),
            ("configuracoes", "Título Configurações"),
        ]:
            _chave = "titulo_" + _id
            novo_textos[_chave] = st.text_input(_rotulo, value=textos[_chave], key="edit_" + _chave)

    with pc2:
        st.markdown("**Subtítulos e seções**")
        novo_textos["subtitulo_global"] = st.text_input("Subtítulo principal", value=textos["subtitulo_global"], key="edit_subtitulo_global")
        for _chave, _rotulo in [
            ("secao_dados_reais", "Seção: Dados reais"),
            ("secao_indicadores", "Seção: Indicadores"),
            ("secao_historico", "Seção: Histórico"),
            ("secao_colaboradores", "Seção: Colaboradores"),
            ("secao_equipes", "Seção: Equipes"),
            ("secao_organograma", "Seção: Organograma"),
            ("titulo_plano", "Seção: Plano de carreira"),
        ]:
            novo_textos[_chave] = st.text_input(_rotulo, value=textos[_chave], key="edit_" + _chave)

        st.markdown("**Fontes**")
        _fontes_idx = {x: i for i, x in enumerate(FONTES)}
        novo_fontes["menu"] = st.selectbox("Fonte dos menus", FONTES, index=_fontes_idx.get(fontes.get("menu"), 0), key="font_menu")
        novo_fontes["titulo"] = st.selectbox("Fonte dos títulos", FONTES, index=_fontes_idx.get(fontes.get("titulo"), 0), key="font_titulo")
        novo_fontes["subtitulo"] = st.selectbox("Fonte dos subtítulos", FONTES, index=_fontes_idx.get(fontes.get("subtitulo"), 0), key="font_subtitulo")

    if st.button("SALVAR TEXTOS E FONTES", type="primary", use_container_width=True):
        novo = config.copy()
        novo["textos"] = novo_textos
        novo["fontes"] = novo_fontes
        try:
            if salvar_configuracoes(novo):
                st.session_state.config = novo
                st.success("Textos e fontes salvos no Supabase.")
                st.rerun()
            else:
                st.error("Não foi possível salvar textos e fontes.")
        except Exception as e:
            st.error(f"Erro ao salvar textos e fontes: {e}")

    st.markdown("---")
    st.markdown("### Aparência")'''
          if 'SALVAR TEXTOS E FONTES' not in s:
              s = s.replace(config_marker, block, 1)

          # 9) Rodapé configurável.
          s = s.replace("st.markdown(\"<div class='sidebar-footer'>Gestão Operacional<br>SETTA • Streamlit + Supabase</div>\", unsafe_allow_html=True)", "st.markdown(f\"<div class='sidebar-footer'>{txt('rodape_linha1')}<br>{txt('rodape_linha2')}</div>\", unsafe_allow_html=True)")
          s = s.replace("st.markdown(\"<br><div class='muted'>Gestão Almoxarifado • Streamlit + Supabase • migração em andamento</div>\", unsafe_allow_html=True)", "st.markdown(f\"<br><div class='muted'>{txt('rodape_linha3')}</div>\", unsafe_allow_html=True)")

          p.write_text(s, encoding='utf-8')
          print('streamlit_app.py atualizado')

      - name: Validar Python
        run: python -m py_compile streamlit_app.py

      - name: Commitar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Adiciona personalização de textos e fontes"
          git push
