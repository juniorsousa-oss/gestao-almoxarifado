name: Ativar historico detalhado OTIF
on:
  push:
    paths:
      - '.github/workflows/add-otif-history.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar persistencia historica
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('indicadores_entregas_v2.py')
          s = p.read_text(encoding='utf-8')
          old = 'from supabase_client import get_client\n'
          new = 'from supabase_client import get_client\nfrom indicadores_historico import salvar_snapshot_otif\n'
          if 'from indicadores_historico import salvar_snapshot_otif' not in s:
              if old not in s:
                  raise SystemExit('Import do Supabase não encontrado')
              s = s.replace(old, new, 1)

          old = '''    except Exception:
        pass
    return acao
'''
          new = '''    except Exception:
        pass
    snapshot_versao = salvar_snapshot_otif(resultado, meta)
    return acao, snapshot_versao
'''
          if old not in s:
              raise SystemExit('Bloco final de _salvar não encontrado')
          s = s.replace(old, new, 1)

          old = '                    acao = _salvar(resultado, meta)\n'
          new = '                    acao, snapshot_versao = _salvar(resultado, meta)\n'
          if old not in s:
              raise SystemExit('Chamada de _salvar não encontrada')
          s = s.replace(old, new, 1)

          old = '                    st.success(f"Resultado {acao}: OTIF Almox {resultado[\'otif_almox_pct\']:.2f}%.")\n'
          new = '                    st.success(f"Resultado {acao}: OTIF Almox {resultado[\'otif_almox_pct\']:.2f}% · snapshot detalhado v{snapshot_versao} salvo.")\n'
          if old not in s:
              raise SystemExit('Mensagem de sucesso não encontrada')
          s = s.replace(old, new, 1)

          old = '            st.info("O registro principal armazena apenas o OTIF Almox. A visão Global permanece como diagnóstico separado.")\n'
          new = '            st.info("Resultado e memória de cálculo detalhada foram persistidos. O histórico pode ser consultado sem reenviar as planilhas.")\n'
          if old not in s:
              raise SystemExit('Mensagem pós-registro não encontrada')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('indicadores_dashboard.py')
          s = p.read_text(encoding='utf-8')
          old = 'from indicadores_entregas_v2 import render_alimentacao_entregas_v2\n'
          new = 'from indicadores_entregas_v2 import render_alimentacao_entregas_v2\nfrom indicadores_historico import render_historico_otif\n'
          if 'from indicadores_historico import render_historico_otif' not in s:
              if old not in s:
                  raise SystemExit('Import da alimentação não encontrado')
              s = s.replace(old, new, 1)

          old = '''def render_indicadores(indicadores):
    render_alimentacao_entregas_v2(indicadores)

'''
          new = '''def render_indicadores(indicadores):
    render_alimentacao_entregas_v2(indicadores)
    render_historico_otif()

'''
          if old not in s:
              raise SystemExit('Início de render_indicadores não encontrado')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile indicadores_entregas_v2.py indicadores_historico.py indicadores_dashboard.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add indicadores_entregas_v2.py indicadores_dashboard.py
          git commit -m 'Persiste e consulta memória detalhada do OTIF'
          git push origin main
